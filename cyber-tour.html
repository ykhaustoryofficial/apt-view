<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#10171f">

  <title>역곡지구 하우스토리 | 사이버 단지 산책</title>

  <link
    rel="stylesheet"
    href="assets/css/cyber-tour.css"
  >
</head>

<body>

<main class="tour-app">

  <!-- =====================================================
       01. INTRO
  ====================================================== -->

  <section
    class="scene hero-scene is-active"
    id="heroScene"
  >

    <div class="hero-image">
      <img
        src="assets/images/cyber-tour/aerial.jpg"
        alt="역곡지구 하우스토리 조감도"
      >
    </div>

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <div class="eyebrow">
        CYBER WALK
      </div>

      <h1>
        역곡지구<br>
        하우스토리
      </h1>

      <p>
        우리가 살아갈 단지를<br>
        미리 둘러봅니다.
      </p>

      <button
        class="enter-button"
        id="enterTour"
        type="button"
      >
        <span>단지 둘러보기</span>
        <span>→</span>
      </button>

    </div>

    <div class="hero-guide">
      EXPLORE
    </div>

  </section>


  <!-- =====================================================
       02. MAP
  ====================================================== -->

  <section
    class="scene map-scene"
    id="mapScene"
  >

    <header class="topbar">

      <button
        class="glass-button icon-button"
        id="backToHero"
        type="button"
        aria-label="처음 화면"
      >
        ←
      </button>

      <div class="topbar-title">
        <strong>단지 산책</strong>
        <span>원하는 장소를 선택해보세요.</span>
      </div>

      <button
        class="glass-button"
        id="resetMap"
        type="button"
      >
        전체지도
      </button>

    </header>


    <div class="map-viewport">

      <div
        class="map-stage"
        id="mapStage"
      >

        <img
          class="site-map"
          src="assets/images/cyber-tour/site-map.jpg"
          alt="단지 배치도"
        >


        <!-- 주출입구 -->

        <button
          class="map-point"
          style="--x:73%; --y:58%;"
          data-index="0"
          type="button"
        >
          <span class="point-ring"></span>
          <span class="point-core"></span>
          <span class="point-label">
            주출입구
          </span>
        </button>


        <!-- 중앙정원 -->

        <button
          class="map-point"
          style="--x:50%; --y:49%;"
          data-index="1"
          type="button"
        >
          <span class="point-ring"></span>
          <span class="point-core"></span>
          <span class="point-label">
            중앙정원
          </span>
        </button>


        <!-- 놀이터 -->

        <button
          class="map-point"
          style="--x:39%; --y:38%;"
          data-index="2"
          type="button"
        >
          <span class="point-ring"></span>
          <span class="point-core"></span>
          <span class="point-label">
            어린이놀이터
          </span>
        </button>


        <!-- 커뮤니티 -->

        <button
          class="map-point"
          style="--x:60%; --y:50%;"
          data-index="3"
          type="button"
        >
          <span class="point-ring"></span>
          <span class="point-core"></span>
          <span class="point-label">
            커뮤니티
          </span>
        </button>


        <!-- 남측정원 -->

        <button
          class="map-point"
          style="--x:36%; --y:67%;"
          data-index="4"
          type="button"
        >
          <span class="point-ring"></span>
          <span class="point-core"></span>
          <span class="point-label">
            남측정원
          </span>
        </button>


        <!-- 북측정원 -->

        <button
          class="map-point"
          style="--x:37%; --y:23%;"
          data-index="5"
          type="button"
        >
          <span class="point-ring"></span>
          <span class="point-core"></span>
          <span class="point-label">
            북측정원
          </span>
        </button>

      </div>

    </div>


    <!-- MAP INFO -->

    <div
      class="location-card"
      id="locationCard"
    >

      <div class="location-text">

        <span
          class="location-kicker"
          id="locationKicker"
        >
          EXPLORE MAP
        </span>

        <h2 id="locationName">
          단지 전체보기
        </h2>

        <p id="locationDescription">
          배치도의 포인트를 눌러 단지 곳곳을 살펴보세요.
        </p>

        <button
          class="virtual-walk-button"
          id="openVirtualWalk"
          type="button"
        >
          가상 산책 시작
          <span>→</span>
        </button>

      </div>


      <div class="location-navigation">

        <button
          class="round-button"
          id="prevPoint"
          type="button"
        >
          ←
        </button>

        <span
          class="counter"
          id="pointCounter"
        >
          0 / 6
        </span>

        <button
          class="round-button"
          id="nextPoint"
          type="button"
        >
          →
        </button>

      </div>

    </div>


    <div
      class="map-hint"
      id="mapHint"
    >
      포인트를 눌러 장소를 선택해보세요.
    </div>

  </section>



  <!-- =====================================================
       03. CENTRAL GARDEN VIRTUAL WALK
  ====================================================== -->

  <section
    class="scene walk-scene"
    id="walkScene"
  >

    <div
      class="walk-world"
      id="walkWorld"
    >

      <!-- SKY -->

      <div class="sun"></div>

      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>


      <!-- DISTANT MOUNTAIN / FOREST -->

      <div class="mountain mountain-1"></div>
      <div class="mountain mountain-2"></div>

      <div class="forest-back"></div>


      <!-- APARTMENTS -->

      <div class="apartment apartment-left">

        <div class="apt-roof"></div>

        <div class="windows"></div>

        <div class="apt-side"></div>

      </div>


      <div class="apartment apartment-center">

        <div class="apt-roof"></div>

        <div class="windows"></div>

        <div class="apt-side"></div>

      </div>


      <div class="apartment apartment-right">

        <div class="apt-roof"></div>

        <div class="windows"></div>

        <div class="apt-side"></div>

      </div>


      <!-- GROUND -->

      <div class="garden-ground"></div>


      <!-- WALK PATH -->

      <div class="walk-path">

        <div class="path-line line-left"></div>
        <div class="path-line line-right"></div>

      </div>


      <!-- CENTER LAWN -->

      <div class="central-lawn"></div>


      <!-- FLOWER BED -->

      <div class="flower-bed flower-bed-left"></div>

      <div class="flower-bed flower-bed-right"></div>


      <!-- TREES -->

      <div class="tree tree-1">
        <div class="tree-crown"></div>
        <div class="tree-trunk"></div>
      </div>

      <div class="tree tree-2">
        <div class="tree-crown"></div>
        <div class="tree-trunk"></div>
      </div>

      <div class="tree tree-3">
        <div class="tree-crown"></div>
        <div class="tree-trunk"></div>
      </div>

      <div class="tree tree-4">
        <div class="tree-crown"></div>
        <div class="tree-trunk"></div>
      </div>

      <div class="tree tree-5">
        <div class="tree-crown"></div>
        <div class="tree-trunk"></div>
      </div>

      <div class="tree tree-6">
        <div class="tree-crown"></div>
        <div class="tree-trunk"></div>
      </div>


      <!-- BENCH -->

      <div class="bench bench-left">
        <div class="bench-back"></div>
        <div class="bench-seat"></div>
        <div class="bench-leg leg-left"></div>
        <div class="bench-leg leg-right"></div>
      </div>


      <!-- LIGHT -->

      <div class="lamp lamp-left">

        <div class="lamp-head"></div>

        <div class="lamp-light"></div>

      </div>


      <div class="lamp lamp-right">

        <div class="lamp-head"></div>

        <div class="lamp-light"></div>

      </div>


      <!-- PARTICLES -->

      <div class="particles">

        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>

      </div>


      <div class="world-vignette"></div>

    </div>


    <!-- WALK UI -->

    <header class="walk-topbar">

      <button
        class="walk-button"
        id="backToMap"
        type="button"
      >
        ←
      </button>


      <div class="walk-title">

        <strong>
          중앙정원
        </strong>

        <span>
          CENTRAL GARDEN
        </span>

      </div>


      <button
        class="walk-button day-button"
        id="toggleDayNight"
        type="button"
      >
        야간
      </button>

    </header>


    <div class="walk-description">

      <span>
        VIRTUAL WALK · 01
      </span>

      <h2>
        중앙정원을 걷다
      </h2>

      <p>
        단지 배치도를 바탕으로 구성한
        첫 번째 가상 산책 장면입니다.
      </p>

      <div class="drag-guide">

        <span>←</span>

        화면을 좌우로 움직여보세요

        <span>→</span>

      </div>

    </div>


  </section>


</main>


<script src="assets/js/cyber-tour.js"></script>

</body>
</html>
