<script type="module">

import * as THREE from"three";
import{OrbitControls}from"three/addons/controls/OrbitControls.js";

const $=s=>document.querySelector(s);
const viewer=$("#viewer");
const MOBILE=matchMedia("(pointer:coarse)").matches||innerWidth<800;

/* =========================================================
   UNIT
========================================================= */

const W=12.48;
const D=8.45;
const WALL_H=1.55;
const OUTER_T=.18;
const INNER_T=.12;

/*
 FRONT = 화면 기준 아래쪽 = +Z
 REAR  = 위쪽 = -Z
*/

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf2f5f9);

const camera=new THREE.PerspectiveCamera(
  38,
  viewer.clientWidth/viewer.clientHeight,
  .1,
  100
);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    MOBILE?1.75:2
  )
);

renderer.setSize(
  viewer.clientWidth,
  viewer.clientHeight
);

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

viewer.appendChild(renderer.domElement);

/* =========================================================
   ON DEMAND RENDER
========================================================= */

let queued=false;

function render(){
  if(queued)return;
  queued=true;
  requestAnimationFrame(()=>{
    queued=false;
    renderer.render(scene,camera);
  });
}

/* =========================================================
   CONTROLS
========================================================= */

const controls=new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping=false;
controls.enablePan=false;
controls.minDistance=7;
controls.maxDistance=27;
controls.minPolarAngle=.08;
controls.maxPolarAngle=Math.PI/2-.025;
controls.target.set(0,.45,0);
controls.addEventListener("change",render);

/* =========================================================
   LIGHT
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0xc5ccd4,
    2
  )
);

const sun=new THREE.DirectionalLight(
  0xfffdf8,
  3.2
);

sun.position.set(
  -8,
  13,
  9
);

sun.castShadow=true;
sun.shadow.mapSize.set(
  MOBILE?1024:2048,
  MOBILE?1024:2048
);

sun.shadow.camera.left=-12;
sun.shadow.camera.right=12;
sun.shadow.camera.top=12;
sun.shadow.camera.bottom=-12;
sun.shadow.camera.near=.5;
sun.shadow.camera.far=40;
sun.shadow.bias=-.00035;
sun.shadow.normalBias=.025;

scene.add(sun);

const fill=new THREE.DirectionalLight(
  0xddeaff,
  .75
);

fill.position.set(
  8,
  7,
  -8
);

scene.add(fill);

/* =========================================================
   MODEL
========================================================= */

const home=new THREE.Group();
scene.add(home);

/* =========================================================
   PROCEDURAL TEXTURES
========================================================= */

function woodTexture(){
  const c=document.createElement("canvas");
  c.width=1024;
  c.height=1024;
  const x=c.getContext("2d");

  x.fillStyle="#e7e2d8";
  x.fillRect(0,0,1024,1024);

  const row=46;

  for(let y=0;y<1024;y+=row){
    x.strokeStyle="rgba(151,133,110,.18)";
    x.lineWidth=2;
    x.beginPath();
    x.moveTo(0,y);
    x.lineTo(1024,y);
    x.stroke();

    let offset=(Math.floor(y/row)%2)*80;

    for(let xx=-offset;xx<1100;xx+=210){
      x.strokeStyle="rgba(160,140,113,.15)";
      x.beginPath();
      x.moveTo(xx,y);
      x.lineTo(xx,y+row);
      x.stroke();
    }

    for(let n=0;n<3;n++){
      x.strokeStyle="rgba(178,159,132,.06)";
      x.beginPath();
      x.moveTo(0,y+10+n*9);
      x.lineTo(1024,y+10+n*9);
      x.stroke();
    }
  }

  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(3.2,2.2);
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=Math.min(
    renderer.capabilities.getMaxAnisotropy(),
    8
  );

  return t;
}

function tileTexture(color="#d8d4cc"){
  const c=document.createElement("canvas");
  c.width=512;
  c.height=512;
  const x=c.getContext("2d");

  x.fillStyle=color;
  x.fillRect(0,0,512,512);

  x.strokeStyle="rgba(255,255,255,.55)";
  x.lineWidth=3;

  for(let i=0;i<=512;i+=85){
    x.beginPath();
    x.moveTo(i,0);
    x.lineTo(i,512);
    x.stroke();

    x.beginPath();
    x.moveTo(0,i);
    x.lineTo(512,i);
    x.stroke();
  }

  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(2,2);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

/* =========================================================
   MATERIALS
========================================================= */

const MAT={
  wall:new THREE.MeshStandardMaterial({
    color:0xf7f6f2,
    roughness:.82
  }),

  floor:new THREE.MeshStandardMaterial({
    map:woodTexture(),
    roughness:.88
  }),

  tile:new THREE.MeshStandardMaterial({
    map:tileTexture(),
    roughness:.8
  }),

  utilityTile:new THREE.MeshStandardMaterial({
    map:tileTexture("#d3d0c8"),
    roughness:.88
  }),

  glass:new THREE.MeshPhysicalMaterial({
    color:0xa9c6d7,
    roughness:.08,
    transmission:.25,
    transparent:true,
    opacity:.55,
    metalness:0
  }),

  frame:new THREE.MeshStandardMaterial({
    color:0xf0f2f1,
    roughness:.4,
    metalness:.15
  }),

  darkFrame:new THREE.MeshStandardMaterial({
    color:0x555e61,
    roughness:.45,
    metalness:.22
  }),

  cabinet:new THREE.MeshStandardMaterial({
    color:0xe8e4db,
    roughness:.72
  }),

  cabinetWhite:new THREE.MeshStandardMaterial({
    color:0xf5f3ed,
    roughness:.67
  }),

  counter:new THREE.MeshStandardMaterial({
    color:0xd2cec5,
    roughness:.52
  }),

  steel:new THREE.MeshStandardMaterial({
    color:0xaeb7ba,
    roughness:.3,
    metalness:.65
  }),

  cooktop:new THREE.MeshStandardMaterial({
    color:0x353b3e,
    roughness:.18,
    metalness:.22
  }),

  sanitary:new THREE.MeshStandardMaterial({
    color:0xf8f8f5,
    roughness:.32
  }),

  door:new THREE.MeshStandardMaterial({
    color:0xe5dfd4,
    roughness:.7
  }),

  appliance:new THREE.MeshStandardMaterial({
    color:0xe4e7e7,
    roughness:.5,
    metalness:.1
  })
};

/* =========================================================
   HELPERS
========================================================= */

function box(
  w,h,d,
  x,y,z,
  mat,
  shadow=true
){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat
  );

  m.position.set(x,y,z);

  if(shadow){
    m.castShadow=true;
    m.receiveShadow=true;
  }

  home.add(m);
  return m;
}

function wall(
  x1,z1,
  x2,z2,
  h=WALL_H,
  t=INNER_T
){
  const dx=x2-x1;
  const dz=z2-z1;
  const len=Math.hypot(dx,dz);

  const m=box(
    len,h,t,
    (x1+x2)/2,
    h/2,
    (z1+z2)/2,
    MAT.wall
  );

  m.rotation.y=
    -Math.atan2(dz,dx);

  return m;
}

function floorRect(
  w,d,
  x,z,
  mat=MAT.floor,
  y=.015
){
  return box(
    w,.045,d,
    x,y,z,
    mat,
    false
  );
}

/* =========================================================
   BASE FLOOR
========================================================= */

box(
  W,.10,D,
  0,-.05,0,
  new THREE.MeshStandardMaterial({
    color:0xf5f3ee,
    roughness:.9
  })
);

/*
 큰 생활공간
*/
floorRect(
  11.95,
  7.95,
  0,
  .05,
  MAT.floor
);

/*
 욕실 타일
*/
floorRect(
  1.65,
  2.35,
  -5.18,
  -1.85,
  MAT.tile,
  .045
);

floorRect(
  1.65,
  2.15,
  3.62,
  -1.55,
  MAT.tile,
  .045
);

/*
 다용도실
*/
floorRect(
  1.85,
  1.85,
  -3.85,
  -3.25,
  MAT.utilityTile,
  .045
);

/* =========================================================
   EXTERIOR WALLS
========================================================= */

/*
 FRONT
 하단 창문 사이 벽체를 분리해서 배치
*/

const FZ=D/2;

const frontWindows=[
  {x:-4.72,w:1.42},
  {x:-2.22,w:1.22},
  {x:.95,w:2.35},
  {x:4.43,w:1.52}
];

function frontWallWithWindows(){

  const left=-W/2;
  const right=W/2;

  const sill=.26;
  const wh=.87;

  let cursor=left;

  frontWindows.forEach(o=>{

    const a=o.x-o.w/2;
    const b=o.x+o.w/2;

    if(a>cursor){
      wall(
        cursor,FZ,
        a,FZ,
        WALL_H,
        OUTER_T
      );
    }

    box(
      o.w,
      sill,
      OUTER_T,
      o.x,
      sill/2,
      FZ,
      MAT.wall
    );

    const upperY=
      sill+wh;

    box(
      o.w,
      WALL_H-upperY,
      OUTER_T,
      o.x,
      upperY+(WALL_H-upperY)/2,
      FZ,
      MAT.wall
    );

    createWindow(
      o.x,
      sill,
      FZ+.01,
      o.w,
      wh,
      "front"
    );

    cursor=b;
  });

  if(cursor<right){
    wall(
      cursor,FZ,
      right,FZ,
      WALL_H,
      OUTER_T
    );
  }
}

frontWallWithWindows();

/*
 LEFT / RIGHT
*/
wall(
  -W/2,-3.42,
  -W/2,FZ,
  WALL_H,
  OUTER_T
);

wall(
  W/2,-3.15,
  W/2,FZ,
  WALL_H,
  OUTER_T
);

/*
 REAR 윤곽 - A타입 평면 형태를 단순화한 단차형 외벽
*/
wall(
  -W/2,-3.42,
  -4.65,-3.42,
  WALL_H,
  OUTER_T
);

wall(
  -4.65,-3.42,
  -4.65,-4.05,
  WALL_H,
  OUTER_T
);

wall(
  -4.65,-4.05,
  -2.50,-4.05,
  WALL_H,
  OUTER_T
);

wall(
  -2.50,-4.05,
  -2.50,-3.42,
  WALL_H,
  OUTER_T
);

wall(
  -2.50,-3.42,
  .45,-3.42,
  WALL_H,
  OUTER_T
);

wall(
  .45,-3.42,
  .45,-4.20,
  WALL_H,
  OUTER_T
);

wall(
  .45,-4.20,
  3.12,-4.20,
  WALL_H,
  OUTER_T
);

wall(
  3.12,-4.20,
  3.12,-3.15,
  WALL_H,
  OUTER_T
);

wall(
  3.12,-3.15,
  W/2,-3.15,
  WALL_H,
  OUTER_T
);

/* =========================================================
   INTERNAL WALLS
========================================================= */

/* 좌측 욕실 */
wall(-4.32,-3.35,-4.32,-.95);
wall(-W/2,-.95,-4.25,-.95);

/* 현관 / 팬트리 */
wall(-3.05,-3.38,-3.05,-1.50);
wall(-3.05,-1.50,-1.70,-1.50);
wall(-1.70,-1.50,-1.70,-2.60);

/* 침실 */
wall(-3.32,.55,-3.32,FZ);
wall(-1.30,.55,-1.30,FZ);

/* 거실-안방 */
wall(2.72,.55,2.72,FZ);

/* 주방 쪽 */
wall(-1.70,-2.52,-.10,-2.52);
wall(-.10,-2.52,-.10,-3.35);

/* 욕실2 */
wall(2.72,-3.05,2.72,-.55);
wall(2.72,-.55,4.38,-.55);
wall(4.38,-3.05,4.38,-.55);

/* 드레스룸 */
wall(4.38,-3.05,W/2,-3.05);

/* 작은 수납부 */
wall(1.85,-3.38,1.85,-2.42);
wall(1.85,-2.42,2.55,-2.42);

/* =========================================================
   WINDOWS
========================================================= */

function createWindow(
  x,
  sill,
  z,
  w,
  h,
  face="front"
){

  const depth=.055;

  /*
   유리
  */
  box(
    w-.09,
    h-.09,
    depth,
    x,
    sill+h/2,
    z,
    MAT.glass,
    false
  );

  /*
   상하 프레임
  */
  box(
    w,.055,.075,
    x,
    sill,
    z,
    MAT.frame
  );

  box(
    w,.055,.075,
    x,
    sill+h,
    z,
    MAT.frame
  );

  /*
   좌우 프레임
  */
  box(
    .055,h,.075,
    x-w/2,
    sill+h/2,
    z,
    MAT.frame
  );

  box(
    .055,h,.075,
    x+w/2,
    sill+h/2,
    z,
    MAT.frame
  );

  /*
   중앙 분할
  */
  box(
    .04,h-.08,.07,
    x,
    sill+h/2,
    z,
    MAT.frame
  );

  if(w>1.8){
    box(
      .04,h-.08,.07,
      x-w/4,
      sill+h/2,
      z,
      MAT.frame
    );

    box(
      .04,h-.08,.07,
      x+w/4,
      sill+h/2,
      z,
      MAT.frame
    );
  }
}

/*
 후면 창호
*/
createRearWindow(-3.58,-4.065,1.00,.66);
createRearWindow(-.92,-3.435,1.18,.58);
createRearWindow(2.05,-4.215,.88,.65);
createRearWindow(4.80,-3.165,.92,.65);

function createRearWindow(
  x,z,w,h
){
  const sill=.64;

  /*
   벽 앞에 깊이감을 주는 어두운 recess
  */
  box(
    w+.12,
    h+.12,
    .045,
    x,
    sill+h/2,
    z+.02,
    MAT.darkFrame
  );

  box(
    w,
    h,
    .055,
    x,
    sill+h/2,
    z+.045,
    MAT.glass,
    false
  );

  box(
    w+.08,
    .045,
    .07,
    x,
    sill,
    z+.065,
    MAT.frame
  );

  box(
    w+.08,
    .045,
    .07,
    x,
    sill+h,
    z+.065,
    MAT.frame
  );

  box(
    .045,
    h,
    .07,
    x-w/2,
    sill+h/2,
    z+.065,
    MAT.frame
  );

  box(
    .045,
    h,
    .07,
    x+w/2,
    sill+h/2,
    z+.065,
    MAT.frame
  );
}

/* =========================================================
   KITCHEN
========================================================= */

/*
 후면 긴 주방
*/
box(
  3.05,
  .78,
  .60,
  -.65,
  .39,
  -3.02,
  MAT.cabinet
);

box(
  3.13,
  .055,
  .68,
  -.65,
  .81,
  -3.02,
  MAT.counter
);

/*
 ㄱ자 오른쪽 부분
*/
box(
  .62,
  .78,
  2.00,
  .61,
  .39,
  -2.15,
  MAT.cabinet
);

box(
  .70,
  .055,
  2.08,
  .61,
  .81,
  -2.15,
  MAT.counter

/* =========================================================
   CAMERA
========================================================= */

function set3D(){

  camera.up.set(
    0,1,0
  );

  camera.position.set(
    10.8,
    11.8,
    12.4
  );

  controls.target.set(
    0,
    .38,
    -.15
  );

  controls.update();

  setButton("btn3d");
  render();
}

function setTop(){

  camera.up.set(
    0,
    0,
    -1
  );

  camera.position.set(
    0,
    21,
    .001
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

  setButton("btnTop");
  render();
}

function setButton(id){

  document
    .querySelectorAll(".action")
    .forEach(
      b=>b.classList.remove("active")
    );

  if(id){
    document
      .getElementById(id)
      ?.classList.add("active");
  }
}

$("#btn3d").onclick=set3D;
$("#btnTop").onclick=setTop;

$("#btnReset").onclick=()=>{
  set3D();
};

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      viewer.clientWidth/
      viewer.clientHeight;

    camera
      .updateProjectionMatrix();

    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        MOBILE?1.75:2
      )
    );

    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );

    render();
  }
);

/* =========================================================
   DOUBLE TAP BLOCK
========================================================= */

let lastTouch=0;

viewer.addEventListener(
  "touchend",
  e=>{

    const now=Date.now();

    if(
      now-lastTouch<
      280
    ){
      e.preventDefault();
    }

    lastTouch=now;
  },
  {passive:false}
);

/* =========================================================
   START
========================================================= */

set3D();
