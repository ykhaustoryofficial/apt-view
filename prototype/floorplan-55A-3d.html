<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>55A 타입 3D 평면도</title>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:linear-gradient(180deg,#eef3fb,#f7f9fc);color:#2f3d56;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}
button{font:inherit}
.wrap{max-width:980px;margin:auto;padding:28px 18px 48px}
.hero{text-align:center;margin-bottom:22px}
.hero h1{margin:0 0 10px;font-size:clamp(2rem,4vw,2.8rem);font-weight:800;letter-spacing:-.03em;color:#394969}
.hero p{margin:0;font-size:clamp(1rem,2vw,1.18rem);color:#79859b;line-height:1.7}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:760px;margin:22px auto 28px}
.tab-btn{border:1px solid rgba(100,124,170,.15);background:#fff;color:#55647f;border-radius:18px;min-height:58px;font-size:1.08rem;font-weight:700;box-shadow:0 10px 18px rgba(65,89,128,.06)}
.tab-btn.active{background:linear-gradient(135deg,#82a9eb,#7296d6);color:#fff}

.card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.72);border-radius:30px;box-shadow:0 18px 40px rgba(52,73,94,.12);padding:24px}
.viewer-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap}
.viewer-title h2{margin:0 0 8px;font-size:clamp(1.8rem,3vw,2.4rem);color:#405174;letter-spacing:-.03em}
.viewer-title p{margin:0;color:#6b7890;font-size:1.04rem;line-height:1.6}

.viewer-actions{display:flex;gap:10px;flex-wrap:wrap}
.control-btn{border:0;border-radius:14px;padding:12px 18px;background:#fff;color:#425271;font-weight:700;box-shadow:0 8px 16px rgba(63,82,118,.09)}
.control-btn.primary{background:linear-gradient(135deg,#8db3ef,#789de0);color:#fff}

.viewer-box{position:relative;width:100%;height:560px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 0,#fff,#edf2f8);border:1px solid rgba(186,200,220,.4);touch-action:none}
.viewer-box canvas{display:block;width:100%;height:100%;touch-action:none}

.viewer-badge{position:absolute;z-index:5;left:18px;top:18px;background:rgba(255,255,255,.9);border-radius:18px;padding:12px 16px;box-shadow:0 10px 24px rgba(59,83,119,.12);pointer-events:none}
.viewer-badge strong{display:block;font-size:1.05rem;color:#33445f;margin-bottom:4px}
.viewer-badge span{display:block;color:#6b7890;font-size:.9rem;line-height:1.45}

.error-box{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);max-width:80%;padding:16px 20px;border-radius:15px;background:#fff;color:#a34d48;box-shadow:0 10px 30px rgba(0,0,0,.12);font-size:13px;line-height:1.6;display:none}

.meta{margin-top:22px}
.meta h3{margin:0 0 8px;font-size:clamp(1.85rem,3vw,2.5rem);color:#425273}
.meta p{margin:0;font-size:1.1rem;color:#7a869a}

@media(max-width:760px){
  .wrap{padding:22px 14px 36px}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:18px;border-radius:24px}
  .viewer-box{height:430px;border-radius:22px}
}
</style>
</head>

<body>
<div class="wrap">

<div class="hero">
<h1>세대 평면도</h1>
<p>역곡지구 하우스토리 55타입 세대별 평면도를 확인하고 의견을 나눠보세요.</p>
</div>

<div class="tabs">
<button class="tab-btn active">55A 타입</button>
<button class="tab-btn" disabled>55B 타입</button>
<button class="tab-btn" disabled>55C 타입</button>
<button class="tab-btn" disabled>55D 타입</button>
<button class="tab-btn" disabled>55E 타입</button>
<button class="tab-btn" disabled>55F 타입</button>
</div>

<section class="card">

<div class="viewer-head">
<div class="viewer-title">
<h2>55A 타입 3D 평면도</h2>
<p>평면도를 바닥에 적용하고 벽체를 입체화한 시험 버전입니다.</p>
</div>

<div class="viewer-actions">
<button class="control-btn primary" id="btn3d">3D</button>
<button class="control-btn" id="btnTop">TOP</button>
<button class="control-btn" id="btnReset">초기화</button>
</div>
</div>

<div class="viewer-box" id="viewerBox">

<div class="viewer-badge">
<strong>UNIT_A · 055.9200A</strong>
<span>손가락/마우스로 회전</span>
<span>핀치/휠로 확대·축소</span>
</div>

<div class="error-box" id="errorBox"></div>

</div>

<div class="meta">
<h3>55A 타입 평면도</h3>
<p>55.92㎡ / 642세대</p>
</div>

</section>
</div>

<script type="module">

import * as THREE from "three";
import{OrbitControls}from"three/addons/controls/OrbitControls.js";

/* =========================================================
   IMPORTANT
   HTML = prototype/floorplan-55A-3d.html
   IMAGE = assets/images/floorplans/55A.PNG
========================================================= */

const PLAN_IMAGE="../assets/images/floorplans/55A.PNG";

const PLAN={
  width:12.48,
  wallHeight:1.35,
  wallThickness:.12
};

const WALL_SEGMENTS=[
  /* OUTER */
  [.03,.18,.03,.90],
  [.03,.90,.97,.90],
  [.97,.90,.97,.20],
  [.97,.20,.80,.20],
  [.80,.20,.80,.12],
  [.80,.12,.55,.12],
  [.55,.12,.55,.20],
  [.55,.20,.38,.20],
  [.38,.20,.38,.12],
  [.38,.12,.17,.12],
  [.17,.12,.17,.21],
  [.17,.21,.03,.21],

  /* INNER */
  [.16,.20,.16,.53],
  [.03,.52,.17,.52],

  [.30,.60,.30,.90],
  [.43,.60,.43,.90],
  [.70,.60,.70,.90],

  [.26,.43,.42,.43],
  [.26,.30,.26,.43],
  [.42,.31,.42,.43],

  [.77,.24,.77,.57],
  [.77,.57,.90,.57],
  [.86,.24,.86,.57],
  [.90,.20,.90,.57],
  [.77,.31,.90,.31],

  [.70,.28,.73,.28],
  [.73,.28,.73,.34]
];

const viewer=document.getElementById("viewerBox");
const errorBox=document.getElementById("errorBox");

const IS_MOBILE=
  matchMedia("(pointer:coarse)").matches||
  innerWidth<=820;

/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf2f5fa);

const camera=
  new THREE.PerspectiveCamera(
    42,
    viewer.clientWidth/viewer.clientHeight,
    .1,
    100
  );

const renderer=
  new THREE.WebGLRenderer({
    antialias:!IS_MOBILE,
    powerPreference:IS_MOBILE?"low-power":"default"
  });

renderer.setPixelRatio(
  IS_MOBILE
    ?1
    :Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
  viewer.clientWidth,
  viewer.clientHeight
);

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

viewer.appendChild(renderer.domElement);

/* =========================================================
   LIGHT
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0xaab2bd,
    2.5
  )
);

const sun=
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

sun.position.set(
  8,
  15,
  10
);

scene.add(sun);

/* =========================================================
   CAMERA CONTROL
========================================================= */

const controls=
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping=false;
controls.enablePan=false;

controls.minDistance=7;
controls.maxDistance=26;

controls.minPolarAngle=.08;
controls.maxPolarAngle=
  Math.PI/2-.03;

controls.target.set(
  0,
  .5,
  0
);

controls.addEventListener(
  "change",
  requestRender
);

/* =========================================================
   ON DEMAND RENDER
========================================================= */

let renderPending=false;

function requestRender(){

  if(renderPending)return;

  renderPending=true;

  requestAnimationFrame(()=>{
    renderPending=false;
    renderer.render(scene,camera);
  });

}

/* =========================================================
   MODEL
========================================================= */

const model=
  new THREE.Group();

scene.add(model);

let planDepth=8.8;

/* =========================================================
   BACKGROUND FLOOR
========================================================= */

const ground=
  new THREE.Mesh(
    new THREE.PlaneGeometry(50,50),
    new THREE.MeshBasicMaterial({
      color:0xe8edf4
    })
  );

ground.rotation.x=
  -Math.PI/2;

ground.position.y=
  -.04;

scene.add(ground);

/* =========================================================
   PLAN TEXTURE
========================================================= */

new THREE.TextureLoader().load(

  PLAN_IMAGE,

  texture=>{

    texture.colorSpace=
      THREE.SRGBColorSpace;

    texture.anisotropy=
      Math.min(
        renderer.capabilities
          .getMaxAnisotropy(),
        8
      );

    const image=
      texture.image;

    planDepth=
      PLAN.width*
      (
        image.height/
        image.width
      );

    createPlan(texture);
    createWalls();
    set3DView();

    requestRender();

  },

  undefined,

  error=>{

    console.error(
      "55A 이미지 로드 실패",
      PLAN_IMAGE,
      error
    );

    errorBox.style.display="block";

    errorBox.innerHTML=
      "55A.PNG를 불러오지 못했습니다.<br>"+
      "확인 경로:<br>"+
      "<b>assets/images/floorplans/55A.PNG</b>";

    /*
      이미지가 없어도 THREE 자체가
      정상 작동하는지 확인하기 위해
      임시 바닥/벽은 생성한다.
    */

    createFallback();
    createWalls();
    set3DView();

    requestRender();

  }

);

/* =========================================================
   FLOOR PLAN
========================================================= */

function createPlan(texture){

  const mesh=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        PLAN.width,
        planDepth
      ),
      new THREE.MeshBasicMaterial({
        map:texture,
        side:THREE.DoubleSide
      })
    );

  mesh.rotation.x=
    -Math.PI/2;

  mesh.position.y=.005;

  model.add(mesh);
}

function createFallback(){

  const mesh=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        PLAN.width,
        planDepth
      ),
      new THREE.MeshBasicMaterial({
        color:0xffffff,
        side:THREE.DoubleSide
      })
    );

  mesh.rotation.x=
    -Math.PI/2;

  model.add(mesh);
}

/* =========================================================
   WALLS
========================================================= */

const wallMaterial=
  new THREE.MeshStandardMaterial({
    color:0xfafafa,
    roughness:.72
  });

function normalToWorld(
  nx,
  nz
){

  return{
    x:
      (nx-.5)*
      PLAN.width,

    z:
      (nz-.5)*
      planDepth
  };

}

function createWalls(){

  WALL_SEGMENTS.forEach(
    wall=>{
      createWall(
        ...wall
      );
    }
  );

}

function createWall(
  x1,
  z1,
  x2,
  z2
){

  const a=
    normalToWorld(
      x1,
      z1
    );

  const b=
    normalToWorld(
      x2,
      z2
    );

  const dx=
    b.x-a.x;

  const dz=
    b.z-a.z;

  const length=
    Math.hypot(
      dx,
      dz
    );

  const mesh=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        length,
        PLAN.wallHeight,
        PLAN.wallThickness
      ),
      wallMaterial
    );

  mesh.position.set(
    (a.x+b.x)/2,
    PLAN.wallHeight/2,
    (a.z+b.z)/2
  );

  mesh.rotation.y=
    -Math.atan2(
      dz,
      dx
    );

  model.add(mesh);

}

/* =========================================================
   CAMERA PRESETS
========================================================= */

function set3DView(){

  camera.up.set(
    0,
    1,
    0
  );

  camera.position.set(
    9,
    10,
    11
  );

  controls.target.set(
    0,
    .45,
    0
  );

  controls.update();

  requestRender();
}

function setTopView(){

  camera.up.set(
    0,
    0,
    -1
  );

  camera.position.set(
    0,
    20,
    .001
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

  requestRender();
}

/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("btn3d")
  .onclick=
    set3DView;

document
  .getElementById("btnTop")
  .onclick=
    setTopView;

document
  .getElementById("btnReset")
  .onclick=
    set3DView;

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      viewer.clientWidth/
      viewer.clientHeight;

    camera
      .updateProjectionMatrix();

    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );

    requestRender();

  }
);

/* =========================================================
   START TEST RENDER
========================================================= */

/*
  텍스처가 로드되기 전에도
  WebGL이 정상 작동하면 배경은 즉시 나타난다.
*/

camera.position.set(
  9,
  10,
  11
);

camera.lookAt(
  0,
  0,
  0
);

requestRender();

</script>

</body>
</html>
