<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HAUSTORY 25F Building Prototype</title>

<style>
*{box-sizing:border-box}

:root{
  --building-width:min(58vw,330px);
  --building-height:min(82vh,760px);

  --frame:#eef1ef;
  --frame-shadow:#cbd2d1;

  --dark:#303c42;
  --dark-deep:#202c32;

  --glass:#71868e;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100svh;
  overflow:hidden;

  display:grid;
  place-items:center;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #d5e8ef 0%,
      #bfd7e1 52%,
      #a7b89d 52%,
      #84987b 100%
    );
}

/* =============================================
   SCENE
============================================= */

.scene{
  position:relative;
  width:100%;
  height:100svh;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.scene::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 45% 24%,
      rgba(255,255,255,.55),
      transparent 45%
    );
}

/* =============================================
   BUILDING
============================================= */

.building{
  position:relative;

  width:var(--building-width);
  height:var(--building-height);

  margin-top:38px;

  filter:
    drop-shadow(
      24px 28px 30px
      rgba(31,43,43,.22)
    );
}

/* =============================================
   RIGHT SIDE / DEPTH

   본체는 회전시키지 않고
   측면만 별도의 면으로 만든다.
============================================= */

.side-face{
  position:absolute;

  z-index:1;

  top:54px;
  bottom:2px;

  right:-61px;

  width:64px;

  overflow:hidden;

  clip-path:
    polygon(
      0 3%,
      100% 0,
      100% 96%,
      0 100%
    );

  background:
    linear-gradient(
      90deg,
      #68767a 0%,
      #536166 45%,
      #35444a 100%
    );

  border-right:
    5px solid
    #d3d9d7;

  box-shadow:
    inset 10px 0 16px
    rgba(0,0,0,.14);
}

.side-floor-stack{
  position:absolute;
  inset:86px 5px 7px 8px;

  display:grid;

  grid-template-rows:
    repeat(var(--floors),1fr);

  gap:1px;
}

.side-floor{
  position:relative;

  border-top:
    1px solid
    rgba(255,255,255,.12);
}

.side-floor::before,
.side-floor::after{
  content:"";

  position:absolute;

  top:18%;
  bottom:18%;

  width:29%;

  background:
    linear-gradient(
      180deg,
      #70858c,
      #34484f
    );

  border:
    1px solid
    rgba(22,32,36,.75);

  box-shadow:
    inset 0 0 4px
    rgba(255,255,255,.1);
}

.side-floor::before{
  left:10%;
}

.side-floor::after{
  right:9%;
}

/* side roof */

.side-roof{
  position:absolute;

  left:0;
  right:0;
  top:0;

  height:90px;

  background:
    linear-gradient(
      90deg,
      #aeb8b8,
      #7f8d90
    );

  clip-path:
    polygon(
      0 28%,
      100% 7%,
      100% 100%,
      0 100%
    );
}

/* =============================================
   FRONT
============================================= */

.front{
  position:absolute;

  z-index:5;

  inset:0;

  overflow:visible;

  background:
    linear-gradient(
      90deg,
      #e9ecea 0 6%,
      #303c42 6% 94%,
      #edf0ee 94% 100%
    );

  border-left:
    6px solid #f3f4f2;

  border-right:
    6px solid #e4e8e6;

  box-shadow:
    inset -10px 0 14px
    rgba(0,0,0,.07);
}

/* =============================================
   SIGNATURE ROOFTOP

   ★ 건물에서 유일하게 기울어지는 부분
============================================= */

.signature{
  position:absolute;

  z-index:30;

  left:-8px;
  right:-8px;

  top:-70px;

  height:118px;

  background:
    linear-gradient(
      105deg,
      #e0e5e5 0%,
      #f6f7f5 54%,
      #dce2e1 100%
    );

  clip-path:
    polygon(
      0 42%,
      100% 3%,
      100% 100%,
      0 100%
    );

  border-bottom:
    4px solid
    #c9d0cf;

  box-shadow:
    0 8px 14px
    rgba(32,45,47,.11);
}

/* 시그니처 측면 두께 */

.signature::after{
  content:"";

  position:absolute;

  right:-24px;
  top:5px;

  width:25px;
  height:113px;

  background:
    linear-gradient(
      90deg,
      #b6c0c0,
      #8d999b
    );

  clip-path:
    polygon(
      0 0,
      100% 13%,
      100% 100%,
      0 100%
    );
}

.brand{
  position:absolute;

  right:8%;
  bottom:20px;

  font-size:
    clamp(24px,5.2vw,39px);

  line-height:1;

  font-weight:850;

  letter-spacing:-.055em;

  color:#283238;

  text-shadow:
    0 2px 0 rgba(255,255,255,.85),
    0 3px 4px rgba(0,0,0,.18);
}

/* =============================================
   ROOF EQUIPMENT
============================================= */

.roof-equipment{
  position:absolute;

  z-index:20;

  left:12%;
  right:9%;
  top:-19px;

  height:36px;

  pointer-events:none;
}

.machine-room{
  position:absolute;

  right:5%;
  bottom:0;

  width:24%;
  height:32px;

  background:
    linear-gradient(
      90deg,
      #adb7b7,
      #e0e5e3 55%,
      #929fa1
    );

  box-shadow:
    4px 5px 7px
    rgba(0,0,0,.15);
}

.solar{
  position:absolute;

  top:10px;

  height:14px;

  border:
    1px solid #435861;

  transform:
    skewX(-22deg);

  background:
    repeating-linear-gradient(
      90deg,
      #597581 0 8px,
      #344d58 8px 10px
    );
}

.solar-a{
  left:4%;
  width:30%;
}

.solar-b{
  left:39%;
  width:22%;
}

/* =============================================
   TOP FLOOR
============================================= */

.top-floor{
  position:absolute;

  z-index:10;

  left:20px;
  right:20px;

  top:36px;

  height:82px;

  padding:6px 8px;

  display:grid;

  grid-template-columns:
    1.15fr .72fr 1.15fr .72fr 1.15fr;

  gap:7px;

  background:#303c42;

  border-top:
    3px solid #263238;

  border-bottom:
    3px solid #202a2f;
}

.top-glass{
  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      150deg,
      #aab8ba 0%,
      #71878e 45%,
      #394b52 100%
    );

  border:
    2px solid #263238;

  box-shadow:
    inset 0 0 15px
    rgba(255,214,150,.16);
}

.top-glass::before{
  content:"";

  position:absolute;

  left:50%;
  top:0;
  bottom:0;

  width:2px;

  background:#263238;
}

.top-glass::after{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      125deg,
      rgba(255,255,255,.18),
      transparent 40%
    );
}

/* =============================================
   REGULAR FLOOR BODY
============================================= */

.facade{
  position:absolute;

  left:19px;
  right:19px;

  top:118px;
  bottom:8px;

  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #243037 0%,
      #39464c 16%,
      #2e3a40 50%,
      #39464c 84%,
      #243037 100%
    );
}

.floor-stack{
  position:absolute;

  inset:0;

  display:grid;

  grid-template-rows:
    repeat(var(--floors),1fr);
}

.floor{
  position:relative;

  display:grid;

  grid-template-columns:
    1.18fr .72fr 1.18fr .72fr;

  gap:8px;

  padding:
    2px 11px;

  border-top:
    1px solid
    rgba(225,231,230,.18);
}

/* =============================================
   WINDOWS
============================================= */

.window{
  position:relative;

  overflow:hidden;

  border:
    1px solid
    #202b30;

  background:
    linear-gradient(
      145deg,
      #85999f 0%,
      #53676e 46%,
      #314249 100%
    );

  box-shadow:
    inset 1px 1px 4px
    rgba(255,255,255,.13),

    inset -2px -2px 5px
    rgba(0,0,0,.18);
}

/* 유리 반사 */

.window::before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      130deg,
      rgba(255,255,255,.13),
      transparent 43%
    );
}

/* 가운데 창틀 */

.window::after{
  content:"";

  position:absolute;

  left:50%;
  top:0;
  bottom:0;

  width:1px;

  background:
    rgba(25,36,41,.8);
}

/* 발코니 */

.window.balcony{
  background:
    linear-gradient(
      180deg,
      #71858b,
      #3f535a
    );
}

.window.balcony span{
  position:absolute;

  z-index:5;

  left:0;
  right:0;

  bottom:22%;

  height:1px;

  background:
    #202a2f;

  box-shadow:
    0 -4px 0
    rgba(25,35,40,.55);
}

/* 불 켜진 세대 */

.window.lit{
  background:
    linear-gradient(
      150deg,
      #c7b68d,
      #856f53 53%,
      #493f37
    );

  box-shadow:
    inset 0 0 10px
    rgba(255,215,146,.42);
}

/* =============================================
   LARGE WHITE VERTICAL FRAMES
============================================= */

.vertical-frame{
  position:absolute;

  z-index:16;

  top:111px;
  bottom:0;

  width:7.2%;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      #cad1cf,
      #f5f6f3 48%,
      #d6dcda
    );

  box-shadow:
    2px 0 5px
    rgba(0,0,0,.08);
}

.frame-left{
  left:8%;
}

.frame-center{
  left:46.5%;
}

.frame-right{
  right:7%;
}

/* =============================================
   THIN HORIZONTAL DETAIL BANDS

   실제 이미지처럼 아주 얇게만
============================================= */

.horizontal-band{
  position:absolute;

  z-index:17;

  left:18px;
  right:18px;

  height:4px;

  background:
    linear-gradient(
      180deg,
      #f5f6f4,
      #c9d0cf
    );

  box-shadow:
    0 1px 2px
    rgba(0,0,0,.08);
}

.band-1{top:34%}
.band-2{top:57%}
.band-3{top:79%}

/* =============================================
   LOWER BASE
============================================= */

.base{
  position:absolute;

  z-index:18;

  left:4%;
  right:4%;
  bottom:0;

  height:8px;

  background:
    linear-gradient(
      90deg,
      #c8cfcd,
      #eef0ee,
      #b9c1c0
    );
}

/* =============================================
   SHADOW
============================================= */

.ground-shadow{
  position:absolute;

  z-index:0;

  left:5%;
  right:-17%;

  bottom:-18px;

  height:33px;

  border-radius:50%;

  background:
    rgba(24,42,39,.18);

  filter:
    blur(13px);
}

/* =============================================
   MOBILE
============================================= */

@media(max-width:500px){

  :root{
    --building-width:min(61vw,335px);
    --building-height:min(80vh,750px);
  }

  .building{
    margin-top:44px;
  }

  .side-face{
    right:-48px;
    width:51px;
  }

  .signature::after{
    right:-18px;
    width:19px;
  }

}
</style>
</head>

<body>

<main class="scene">

  <div class="building">

    <!-- 오른쪽 측면 -->
    <div class="side-face">

      <div class="side-roof"></div>

      <div
        class="side-floor-stack"
        id="sideFloorStack"
      ></div>

    </div>


    <!-- 정면 -->
    <div class="front">

      <!-- 옥상 장비 -->
      <div class="roof-equipment">

        <div class="machine-room"></div>

        <div class="solar solar-a"></div>
        <div class="solar solar-b"></div>

      </div>


      <!-- 사선 시그니처 -->
      <div class="signature">
        <div class="brand">
          HAUSTORY
        </div>
      </div>


      <!-- 25층 -->
      <div class="top-floor">

        <div class="top-glass"></div>
        <div class="top-glass"></div>
        <div class="top-glass"></div>
        <div class="top-glass"></div>
        <div class="top-glass"></div>

      </div>


      <!-- 1~24층 -->
      <div class="facade">

        <div
          class="floor-stack"
          id="floorStack"
        ></div>

      </div>


      <!-- 외벽 세로 프레임 -->
      <div class="vertical-frame frame-left"></div>
      <div class="vertical-frame frame-center"></div>
      <div class="vertical-frame frame-right"></div>


      <!-- 얇은 가로 프레임 -->
      <div class="horizontal-band band-1"></div>
      <div class="horizontal-band band-2"></div>
      <div class="horizontal-band band-3"></div>


      <div class="base"></div>

    </div>


    <div class="ground-shadow"></div>

  </div>

</main>


<script>
const TOTAL_FLOORS = 25;

/*
  25층은 별도 최상층 디자인이므로
  반복 일반층은 24개.
*/
const REGULAR_FLOORS =
  TOTAL_FLOORS - 1;


const floorStack =
  document.getElementById(
    "floorStack"
  );

const sideFloorStack =
  document.getElementById(
    "sideFloorStack"
  );


floorStack.style.setProperty(
  "--floors",
  REGULAR_FLOORS
);

sideFloorStack.style.setProperty(
  "--floors",
  REGULAR_FLOORS
);


/*
  같은 새로고침에서 무작위로
  지나치게 바뀌지 않도록
  간단한 규칙으로 조명 세대 결정.
*/
function shouldLight(
  floor,
  column
){

  return (
    (floor * 3 + column * 5) % 19 === 0
    ||
    (floor * 7 + column) % 31 === 0
  );

}


/*
  정면 일반층 생성
*/
for(
  let floor = REGULAR_FLOORS;
  floor >= 1;
  floor--
){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "floor";

  row.dataset.floor =
    floor;


  for(
    let column = 0;
    column < 4;
    column++
  ){

    const windowEl =
      document.createElement(
        "div"
      );

    const balcony =
      column === 0
      ||
      column === 2;


    windowEl.className =
      balcony
        ? "window balcony"
        : "window";


    if(
      shouldLight(
        floor,
        column
      )
    ){

      windowEl.classList.add(
        "lit"
      );

    }


    if(balcony){

      const rail =
        document.createElement(
          "span"
        );

      windowEl.appendChild(
        rail
      );

    }


    row.appendChild(
      windowEl
    );

  }


  floorStack.appendChild(
    row
  );

}


/*
  오른쪽 측면 층 생성
*/
for(
  let floor = REGULAR_FLOORS;
  floor >= 1;
  floor--
){

  const sideRow =
    document.createElement(
      "div"
    );

  sideRow.className =
    "side-floor";

  sideFloorStack.appendChild(
    sideRow
  );

}
</script>

</body>
</html>
