<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25F Apartment Prototype</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #d3e8f0 0%,
      #c4dce7 52%,
      #a7b89f 52%,
      #879b80 100%
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;
}

/* =========================================================
   BUILDING WRAPPER
========================================================= */

.building{
  position:relative;

  width:min(62vw,360px);
  height:min(84vh,790px);

  perspective:1400px;

  filter:
    drop-shadow(
      0 30px 34px
      rgba(25,35,40,.24)
    );
}

/* =========================================================
   MAIN TOWER
========================================================= */

.tower{
  position:absolute;

  inset:0;

  overflow:visible;

  transform:
    perspective(1400px)
    rotateY(-6deg);

  transform-style:preserve-3d;

  transform-origin:center bottom;

  background:
    linear-gradient(
      90deg,
      #e6e9e8 0 7%,
      #344047 7% 93%,
      #e9eceb 93% 100%
    );

  border-left:
    7px solid #edf0ef;

  border-right:
    7px solid #edf0ef;
}

/* =========================================================
   SIGNATURE TOP
========================================================= */

.signature{
  position:absolute;

  z-index:8;

  left:-2px;
  right:-2px;
  top:-58px;

  height:92px;

  background:
    linear-gradient(
      110deg,
      #dfe5e5,
      #f4f6f5 60%,
      #cfd6d6
    );

  clip-path:
    polygon(
      0 42%,
      100% 0,
      100% 100%,
      0 100%
    );

  border-bottom:
    4px solid #cfd6d7;

  box-shadow:
    0 5px 9px
    rgba(0,0,0,.12);
}

.signature span{
  position:absolute;

  right:8%;
  bottom:18px;

  font-size:
    clamp(
      22px,
      4.5vw,
      38px
    );

  font-weight:800;

  letter-spacing:-.055em;

  color:#263037;

  text-shadow:
    0 2px 0 rgba(255,255,255,.8),
    0 3px 4px rgba(0,0,0,.15);
}

/* =========================================================
   ROOFTOP
========================================================= */

.roof-unit{
  position:absolute;

  z-index:7;

  left:12%;
  right:9%;
  top:-22px;

  height:34px;

  transform:
    translateZ(-6px);

  pointer-events:none;
}

.roof-box{
  position:absolute;

  right:6%;
  bottom:0;

  width:22%;
  height:30px;

  background:
    linear-gradient(
      90deg,
      #c8cecd,
      #e4e7e5,
      #abb4b4
    );

  box-shadow:
    4px 5px 7px
    rgba(0,0,0,.16);
}

.solar{
  position:absolute;

  top:8px;

  height:14px;

  transform:
    skewX(-24deg);

  border:
    1px solid #4d626b;

  background:
    repeating-linear-gradient(
      90deg,
      #526d79 0 8px,
      #354d58 8px 10px
    );

  box-shadow:
    2px 3px 4px
    rgba(0,0,0,.14);
}

.solar-1{
  left:5%;
  width:30%;
}

.solar-2{
  left:40%;
  width:23%;
}

/* =========================================================
   PENTHOUSE GLASS FLOOR
========================================================= */

.penthouse{
  position:absolute;

  z-index:5;

  left:8px;
  right:8px;
  top:35px;

  height:72px;

  display:grid;

  grid-template-columns:
    1fr .8fr 1.15fr .8fr 1.15fr;

  gap:7px;

  padding:5px 9px;

  background:#364149;
}

.penthouse .glass{
  position:relative;

  background:
    linear-gradient(
      180deg,
      rgba(210,225,226,.8),
      rgba(83,105,114,.85)
    );

  border:
    2px solid #263239;

  box-shadow:
    inset 0 0 18px
    rgba(255,220,160,.18);
}

.penthouse .glass::before{
  content:"";

  position:absolute;

  left:48%;
  top:0;
  bottom:0;

  width:2px;

  background:#263239;
}

/* =========================================================
   FLOOR ZONE
========================================================= */

.floor-zone{
  position:absolute;

  left:25px;
  right:25px;
  top:107px;
  bottom:0;

  display:grid;

  grid-template-rows:
    repeat(var(--floors),1fr);

  background:
    linear-gradient(
      90deg,
      #263239,
      #3a464c 18%,
      #2f3b42 50%,
      #3a464c 82%,
      #263239
    );
}

/* =========================================================
   FLOOR
========================================================= */

.floor{
  position:relative;

  display:grid;

  grid-template-columns:
    1.1fr .82fr 1.1fr .82fr 1.1fr;

  gap:7px;

  padding:
    2px 9px;

  border-top:
    1px solid
    rgba(230,235,235,.25);
}

/* =========================================================
   WINDOWS
========================================================= */

.window{
  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #7e9299,
      #405259 62%,
      #29383e
    );

  border:
    1px solid #202b30;

  box-shadow:
    inset 2px 2px 5px rgba(255,255,255,.13),
    inset -2px -2px 5px rgba(0,0,0,.18);
}

.window::before{
  content:"";

  position:absolute;

  left:50%;
  top:0;
  bottom:0;

  width:1px;

  background:#243037;
}

.window.balcony::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:20%;

  height:1px;

  background:
    rgba(24,34,40,.85);

  box-shadow:
    0 -4px 0
    rgba(24,34,40,.35);
}

/* =========================================================
   VERTICAL FRAMES
========================================================= */

.vertical-frame{
  position:absolute;

  z-index:6;

  top:101px;
  bottom:0;

  width:6.5%;

  background:
    linear-gradient(
      90deg,
      #cfd5d4,
      #f6f7f5 48%,
      #d1d7d6
    );

  box-shadow:
    2px 0 5px
    rgba(0,0,0,.08);

  pointer-events:none;
}

.frame-left{
  left:9%;
}

.frame-center{
  left:47%;
}

.frame-right{
  right:8%;
}

/* =========================================================
   HORIZONTAL BANDS
========================================================= */

.band{
  position:absolute;

  z-index:6;

  left:8px;
  right:8px;

  height:4px;

  background:
    linear-gradient(
      180deg,
      #f5f6f4,
      #cbd2d1
    );

  pointer-events:none;
}

.band-1{
  top:31%;
}

.band-2{
  top:53%;
}

.band-3{
  top:75%;
}

/* =========================================================
   DEEP RIGHT SIDE
========================================================= */

.deep-side{
  position:absolute;

  z-index:-3;

  top:18px;
  right:-68px;
  bottom:8px;

  width:72px;

  transform:
    rotateY(72deg);

  transform-origin:left center;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.07) 0 2px,
      transparent 2px 19px
    ),
    linear-gradient(
      90deg,
      #57666b,
      #303e44
    );

  border-right:
    5px solid #cfd4d4;

  box-shadow:
    13px 15px 24px
    rgba(0,0,0,.16);
}

/* =========================================================
   LEGACY SIDE SHADOW
========================================================= */

.tower::after{
  content:"";

  position:absolute;

  z-index:-2;

  top:14px;
  bottom:0;
  right:-27px;

  width:28px;

  background:
    linear-gradient(
      180deg,
      #879396,
      #5d696c
    );

  transform:
    skewY(-23deg);

  transform-origin:left top;

  opacity:.25;
}

/* =========================================================
   GROUND SHADOW
========================================================= */

.ground-shadow{
  position:absolute;

  left:7%;
  right:-4%;
  bottom:-15px;

  height:26px;

  background:
    rgba(20,35,35,.18);

  filter:
    blur(11px);

  border-radius:50%;
}
</style>
</head>

<body>

<div class="building">

  <div class="tower">

    <div class="signature">
      <span>HAUSTORY</span>
    </div>

    <div class="roof-unit">
      <div class="roof-box"></div>
      <div class="solar solar-1"></div>
      <div class="solar solar-2"></div>
    </div>

    <div class="penthouse">
      <div class="glass"></div>
      <div class="glass"></div>
      <div class="glass"></div>
      <div class="glass"></div>
      <div class="glass"></div>
    </div>

    <div
      class="floor-zone"
      id="floorZone"
    ></div>

    <div class="vertical-frame frame-left"></div>
    <div class="vertical-frame frame-center"></div>
    <div class="vertical-frame frame-right"></div>

    <div class="band band-1"></div>
    <div class="band band-2"></div>
    <div class="band band-3"></div>

    <div class="deep-side"></div>

  </div>

  <div class="ground-shadow"></div>

</div>

<script>
const TOTAL_FLOORS = 25;

const regularFloors =
  TOTAL_FLOORS - 1;

const floorZone =
  document.getElementById("floorZone");

floorZone.style.setProperty(
  "--floors",
  regularFloors
);

for(
  let floor = regularFloors;
  floor >= 1;
  floor--
){

  const row =
    document.createElement("div");

  row.className =
    "floor";

  row.dataset.floor =
    floor;

  row.innerHTML = `
    <div class="window balcony"></div>
    <div class="window"></div>
    <div class="window balcony"></div>
    <div class="window"></div>
    <div class="window balcony"></div>
  `;

  floorZone.appendChild(row);
}
</script>

</body>
</html>
