<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>25F Apartment Prototype</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    linear-gradient(#cfe3ed 0 55%,#a8b7a0 55% 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;
}

/* 전체 건물 */
.building{
  --floors:24;

  position:relative;
  width:min(58vw,330px);
  height:min(82vh,760px);

  perspective:1200px;
  filter:drop-shadow(0 28px 30px rgba(25,35,40,.22));
}

/* 정면 */
.tower{
  position:absolute;
  inset:0;

  overflow:visible;

  background:#e7ebe9;

  border-left:7px solid #edf0ef;
  border-right:7px solid #edf0ef;

  transform:rotateY(-4deg);
  transform-origin:center bottom;
}

/* 최상층 시그니처 */
.signature{
  position:absolute;
  z-index:5;

  left:-2px;
  right:-2px;
  top:-58px;

  height:110px;

  background:#eef2f2;

  clip-path:polygon(
    0 42%,
    100% 0,
    100% 100%,
    0 100%
  );

  border-bottom:4px solid #cfd6d7;
}

.signature span{
  position:absolute;
  right:8%;
  bottom:18px;

  font-size:clamp(24px,5vw,42px);
  font-weight:800;
  letter-spacing:-.04em;

  color:#253039;

  text-shadow:
    0 2px 0 rgba(255,255,255,.8),
    0 3px 4px rgba(0,0,0,.15);
}

/* 최상층 유리층 */
.penthouse{
  position:absolute;

  left:8px;
  right:8px;
  top:35px;

  height:72px;

  display:grid;
  grid-template-columns:1fr .8fr 1.15fr .8fr 1.15fr;

  gap:7px;

  padding:5px 9px;

  background:#364149;
}

.penthouse .glass{
  position:relative;

  background:
    linear-gradient(
      180deg,
      rgba(210,225,226,.8),
      rgba(83,105,114,.85)
    );

  border:2px solid #263239;

  box-shadow:
    inset 0 0 18px rgba(255,220,160,.18);
}

.penthouse .glass::before{
  content:"";

  position:absolute;
  left:48%;
  top:0;
  bottom:0;

  width:2px;

  background:#263239;
}

/* 일반층 영역 */
.floor-zone{
  position:absolute;

  left:8px;
  right:8px;
  top:107px;
  bottom:0;

  display:grid;

  grid-template-rows:
    repeat(var(--floors),1fr);

  background:#333f46;
}

/* 각 층 */
.floor{
  position:relative;

  display:grid;

  grid-template-columns:
    1.1fr .82fr 1.1fr .82fr 1.1fr;

  gap:7px;

  padding:2px 9px;

  border-top:
    1px solid rgba(230,235,235,.25);
}

/* 창 */
.window{
  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #87989d,
      #485b62
    );

  border:
    1px solid #263239;

  box-shadow:
    inset 0 0 8px rgba(255,220,175,.15);
}

.window::before{
  content:"";

  position:absolute;

  left:50%;
  top:0;
  bottom:0;

  width:1px;

  background:#243037;
}

/* 발코니 난간 느낌 */
.window.balcony::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:20%;

  height:1px;

  background:
    rgba(24,34,40,.85);

  box-shadow:
    0 -4px 0 rgba(24,34,40,.35);
}

/* 흰색 세로 프레임 */
.vertical-frame{
  position:absolute;
  z-index:3;

  top:101px;
  bottom:0;

  width:9%;

  background:
    linear-gradient(
      90deg,
      #dfe5e4,
      #f0f3f1 55%,
      #cbd2d1
    );

  pointer-events:none;
}

.frame-left{
  left:8%;
}

.frame-center{
  left:48%;
}

.frame-right{
  right:8%;
}

/* 층 중간의 흰색 가로띠 */
.band{
  position:absolute;
  z-index:4;

  left:8px;
  right:8px;

  height:7px;

  background:
    linear-gradient(
      180deg,
      #eff2f1,
      #cfd6d5
    );

  pointer-events:none;
}

.band-1{top:31%}
.band-2{top:53%}
.band-3{top:75%}

/* 우측 측면 */
.tower::after{
  content:"";

  position:absolute;

  z-index:-1;

  top:14px;
  bottom:0;
  right:-27px;

  width:28px;

  background:
    linear-gradient(
      180deg,
      #879396,
      #5d696c
    );

  transform:
    skewY(-23deg);

  transform-origin:left top;
}

/* 아래 그림자 */
.ground-shadow{
  position:absolute;

  left:7%;
  right:-4%;
  bottom:-15px;

  height:26px;

  background:rgba(20,35,35,.18);

  filter:blur(11px);

  border-radius:50%;
}
</style>
</head>

<body>

<div class="building">

  <div class="tower">

    <div class="signature">
      <span>HAUSTORY</span>
    </div>

    <div class="penthouse">
      <div class="glass"></div>
      <div class="glass"></div>
      <div class="glass"></div>
      <div class="glass"></div>
      <div class="glass"></div>
    </div>

    <div class="floor-zone" id="floorZone"></div>

    <div class="vertical-frame frame-left"></div>
    <div class="vertical-frame frame-center"></div>
    <div class="vertical-frame frame-right"></div>

    <div class="band band-1"></div>
    <div class="band band-2"></div>
    <div class="band band-3"></div>

  </div>

  <div class="ground-shadow"></div>

</div>

<script>
const TOTAL_FLOORS = 25;
const regularFloors = TOTAL_FLOORS - 1;

const floorZone =
  document.getElementById("floorZone");

floorZone.style.setProperty(
  "--floors",
  regularFloors
);

for(let floor=regularFloors; floor>=1; floor--){

  const row =
    document.createElement("div");

  row.className = "floor";
  row.dataset.floor = floor;

  row.innerHTML = `
    <div class="window balcony"></div>
    <div class="window"></div>
    <div class="window balcony"></div>
    <div class="window"></div>
    <div class="window balcony"></div>
  `;

  floorZone.appendChild(row);
}
</script>

</body>
</html>
