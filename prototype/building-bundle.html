<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apartment Unit Bundle Builder</title>

<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;color:#21313b;background:#dfe8e5}
button,input,select,textarea{font:inherit}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}

.panel{position:fixed;z-index:10;left:18px;top:18px;width:340px;max-height:calc(100vh - 36px);overflow:auto;padding:16px;border:1px solid rgba(255,255,255,.65);border-radius:22px;background:rgba(250,252,251,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(38,53,47,.18)}
h1{font-size:18px;margin:0 0 3px}
.sub{font-size:12px;color:#6d7a80;margin-bottom:14px}
.section{padding:12px 0;border-top:1px solid #dbe2df}
.section:first-of-type{border-top:0;padding-top:0}
.section-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#68767b;margin-bottom:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:#68767b}
.field input,.field select{width:100%;height:38px;border:1px solid #d7dfdc;border-radius:11px;background:#fff;padding:0 10px;color:#22333c}
.checks{display:flex;gap:14px;margin:11px 0;font-size:13px}
.checks label{display:flex;gap:6px;align-items:center}
.row{display:flex;gap:7px}
.btn{border:0;border-radius:11px;min-height:38px;padding:0 12px;background:#e6ece9;color:#23343d;font-weight:750;cursor:pointer}
.btn.primary{background:#253b48;color:#fff}
.btn.danger{background:#f5e5e2;color:#8f4036}
.btn.flex{flex:1}

.line-list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.line-item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:9px 10px;border:1px solid #dbe2df;border-radius:11px;background:#fff;text-align:left;color:#263740}
.line-item.active{border-color:#4d6876;box-shadow:0 0 0 2px rgba(77,104,118,.12)}
.line-item b{font-size:12px}
.line-item span{font-size:10px;color:#77848a}
.empty{font-size:11px;color:#899398;padding:6px 1px}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:160px;margin:0 auto}
.pad .blank{visibility:hidden}

.attach{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.attach select{grid-column:1/-1;height:38px;border:1px solid #d7dfdc;border-radius:11px;background:#fff;padding:0 9px}

.code{width:100%;height:115px;resize:vertical;border:1px solid #d7dfdc;border-radius:11px;background:#f8faf9;padding:9px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#405159}

.toolbar{position:fixed;z-index:9;right:18px;top:18px;display:flex;gap:7px}
.toolbar .btn{background:rgba(250,252,251,.9);box-shadow:0 8px 28px rgba(38,53,47,.12);backdrop-filter:blur(12px)}

#selectedLabel{font-weight:800;color:#2c4350}
#stats{font-size:11px;color:#758288;font-weight:700}
#jsonFile{display:none}

@media(max-width:720px){
.toolbar{top:max(12px,env(safe-area-inset-top));right:12px}
.panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:47vh;border-radius:20px;padding:13px}
.line-list{max-height:120px}
.section{padding:10px 0}
h1{font-size:16px}
.sub{margin-bottom:10px}
.code{height:90px}
}
</style>
</head>

<body>

<div id="view"></div>

<div class="toolbar">
<button class="btn" id="fitBtn">3D 맞춤</button>
<button class="btn" id="topBtn">TOP</button>
</div>

<aside class="panel">

<h1>UNIT BUNDLE BUILDER</h1>

<div class="sub">
<span id="stats">라인 0 · 세대모듈 0 · 최고 0F</span>
</div>

<div class="section">

<div class="section-title">
<span>선택/배치</span>
<span id="selectedLabel">선택 없음</span>
</div>

<div class="grid2">

<label class="field">
주택형
<select id="type"></select>
</label>

<label class="field">
FRONT
<select id="front">
<option value="+Z">+Z</option>
<option value="+X">+X</option>
<option value="-Z">-Z</option>
<option value="-X">-X</option>
</select>
</label>

<label class="field">
최고층
<input id="topFloor" type="number" min="1" max="60" value="25">
</label>

<label class="field">
X 좌표
<input id="x" type="number" step="0.5" value="0">
</label>

<label class="field">
Z 좌표
<input id="z" type="number" step="0.5" value="0">
</label>

</div>

<div class="checks">
<label><input id="mirror" type="checkbox">좌우반전</label>
<label><input id="piloti" type="checkbox">1층 필로티</label>
</div>

<div class="row">
<button class="btn primary flex" id="addBtn">새 라인 추가</button>
<button class="btn flex" id="applyBtn">선택 적용</button>
</div>

<div class="row" style="margin-top:7px">
<button class="btn flex" id="duplicateBtn">복제</button>
<button class="btn danger flex" id="deleteBtn">삭제</button>
</div>

</div>

<div class="section">

<div class="section-title">
<span>배치 라인</span>
<span>모델을 눌러도 선택됨</span>
</div>

<div id="lineList" class="line-list"></div>

</div>

<div class="section">

<div class="section-title">
<span>0.5m 이동</span>
<span>방향키도 0.5m</span>
</div>

<div class="pad">

<span class="blank"></span>
<button class="btn" id="nRear">-Z</button>
<span class="blank"></span>

<button class="btn" id="nLeft">-X</button>
<span class="blank"></span>
<button class="btn" id="nRight">+X</button>

<span class="blank"></span>
<button class="btn" id="nFront">+Z</button>
<span class="blank"></span>

</div>

</div>

<div class="section">

<div class="section-title">
<span>자동 붙이기</span>
<span>월드 X/Z 기준</span>
</div>

<div class="attach">

<select id="attachTarget"></select>

<button class="btn" id="attachLeft">대상 왼쪽</button>
<button class="btn" id="attachRight">대상 오른쪽</button>
<button class="btn" id="attachFront">대상 앞(+Z)</button>
<button class="btn" id="attachRear">대상 뒤(-Z)</button>

</div>

</div>

<div class="section">

<div class="section-title">
<span>작업 저장</span>
<span>JSON</span>
</div>

<div class="row">

<button class="btn primary flex" id="saveJsonBtn">
JSON 저장
</button>

<button class="btn flex" id="loadJsonBtn">
JSON 불러오기
</button>

</div>

<input
id="jsonFile"
type="file"
accept=".json,application/json"
>

</div>

<div class="section">

<div class="section-title">

<span>배치 코드</span>

<button class="btn" id="copyBtn">
코드 복사
</button>

</div>

<textarea
id="exportCode"
class="code"
readonly
></textarea>

<div
class="row"
style="margin-top:7px"
>

<button
class="btn danger flex"
id="clearBtn"
>
전체 초기화
</button>

</div>

</div>

</aside>

<script
type="module"
src="./building-bundle.js"
></script>

</body>
</html>
