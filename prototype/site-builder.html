<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HAUSTORY SITE BUILDER</title>

<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;
  background:#cfd9d4;color:#25353d;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%
}
button,input,select{font:inherit}
button{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent
}

#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}

.topbar{
  position:fixed;z-index:20;
  top:max(12px,env(safe-area-inset-top));
  right:12px;
  display:flex;gap:7px
}
.btn{
  border:0;border-radius:11px;
  min-height:39px;padding:0 12px;
  background:#e7ece9;color:#263940;
  font-weight:750;cursor:pointer
}
.topbar .btn{
  background:rgba(249,251,250,.9);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 7px 25px rgba(30,50,42,.12)
}
.btn.primary{background:#29404c;color:#fff}
.btn.danger{background:#f1dfdc;color:#8d4037}
.btn.active{
  background:#29404c;color:white;
  box-shadow:0 0 0 2px rgba(41,64,76,.14)
}

.panel{
  position:fixed;z-index:15;
  left:16px;top:16px;
  width:330px;
  max-height:calc(100vh - 32px);
  overflow:auto;
  padding:15px;
  border:1px solid rgba(255,255,255,.65);
  border-radius:22px;
  background:rgba(249,251,250,.91);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 60px rgba(31,49,42,.17)
}
h1{font-size:17px;margin:0 0 3px}
.subtitle{font-size:11px;color:#748188;margin-bottom:13px}

.section{
  padding:11px 0;
  border-top:1px solid #dde4e1
}
.section:first-of-type{border-top:0;padding-top:0}
.section-title{
  display:flex;justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  font-size:11px;font-weight:800;color:#6b797f
}

.tool-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px
}
.material-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px
}

.tool-btn{
  border:1px solid #d8dfdc;
  border-radius:10px;
  min-height:39px;
  padding:5px;
  background:white;
  font-size:11px;font-weight:750;
  color:#314249
}
.tool-btn.active{
  border-color:#405c68;
  background:#405c68;
  color:white
}

.swatch{
  display:block;width:16px;height:16px;
  border-radius:5px;margin:0 auto 3px;
  border:1px solid rgba(0,0,0,.08)
}
.grass{background:#7fa66d}
.road{background:#62696c}
.sidewalk{background:#c6c2b6}
.plaza{background:#d8ccb8}
.flower{background:#789863}
.water{background:#6ea6b5}

.row{display:flex;gap:6px}
.row>*{flex:1}

select,input{
  width:100%;height:38px;
  border:1px solid #d7dfdc;
  border-radius:10px;
  background:white;
  padding:0 9px;
  color:#2b3c43
}

.status{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  font-size:10px;
  color:#68767c
}
.status div{
  padding:7px 8px;
  border-radius:9px;
  background:#edf1ef
}

.guide{
  font-size:10px;
  line-height:1.55;
  color:#748087
}

#jsonFile{display:none}

@media(max-width:700px){
  .panel{
    left:7px;right:7px;top:auto;
    bottom:max(7px,env(safe-area-inset-bottom));
    width:auto;
    max-height:45vh;
    border-radius:19px;
    padding:12px
  }
  .topbar{right:8px}
  h1{font-size:15px}
  .subtitle{margin-bottom:9px}
  .section{padding:9px 0}
}
</style>
</head>

<body>

<div id="view"></div>

<div class="topbar">
  <button class="btn" id="view3dBtn">3D</button>
  <button class="btn" id="topBtn">TOP</button>
  <button class="btn" id="editToggleBtn">편집 ON</button>
</div>

<aside class="panel">

<h1>HAUSTORY SITE BUILDER</h1>
<div class="subtitle">1 GRID = 1m · HEIGHT STEP = 0.5m</div>

<div class="section">
  <div class="section-title">
    <span>지형 도구</span>
    <span id="currentToolLabel">높이 +0.5m</span>
  </div>

  <div class="tool-grid">
    <button class="tool-btn active" data-tool="raise">높이 +0.5m</button>
    <button class="tool-btn" data-tool="lower">높이 -0.5m</button>
    <button class="tool-btn" data-tool="flatten">지정 높이</button>
    <button class="tool-btn" data-tool="smooth">주변 평균</button>
  </div>

  <div style="margin-top:7px">
    <input id="flattenHeight" type="number" value="0" step="0.5" placeholder="평탄화 높이">
  </div>
</div>

<div class="section">
  <div class="section-title">
    <span>바닥 재질</span>
    <span id="currentMaterialLabel">잔디</span>
  </div>

  <div class="material-grid">

    <button class="tool-btn material-btn active" data-material="grass">
      <span class="swatch grass"></span>잔디
    </button>

    <button class="tool-btn material-btn" data-material="road">
      <span class="swatch road"></span>차도
    </button>

    <button class="tool-btn material-btn" data-material="sidewalk">
      <span class="swatch sidewalk"></span>보도
    </button>

    <button class="tool-btn material-btn" data-material="plaza">
      <span class="swatch plaza"></span>광장
    </button>

    <button class="tool-btn material-btn" data-material="flower">
      <span class="swatch flower"></span>화단
    </button>

    <button class="tool-btn material-btn" data-material="water">
      <span class="swatch water"></span>물
    </button>

  </div>
</div>

<div class="section">

  <div class="section-title">
    <span>브러시</span>
    <span>격자 기준</span>
  </div>

  <div class="row">

    <select id="brushSize">
      <option value="1">1 × 1</option>
      <option value="3">3 × 3</option>
      <option value="5">5 × 5</option>
    </select>

    <select id="editMode">
      <option value="terrain">높이 편집</option>
      <option value="material">재질 칠하기</option>
    </select>

  </div>

</div>

<div class="section">

  <div class="section-title">
    <span>선택 위치</span>
    <span id="hoverLabel">-</span>
  </div>

  <div class="status">
    <div>X <b id="statusX">-</b></div>
    <div>Z <b id="statusZ">-</b></div>
    <div>높이 <b id="statusHeight">-</b></div>
    <div>재질 <b id="statusMaterial">-</b></div>
  </div>

</div>

<div class="section">

  <div class="section-title">
    <span>작업 저장</span>
    <span>terrain.json</span>
  </div>

  <div class="row">
    <button class="btn primary" id="saveBtn">JSON 저장</button>
    <button class="btn" id="loadBtn">JSON 불러오기</button>
  </div>

  <input id="jsonFile" type="file" accept=".json,application/json">

</div>

<div class="section">

  <div class="row">
    <button class="btn" id="flatAllBtn">전체 0m</button>
    <button class="btn danger" id="resetBtn">전체 초기화</button>
  </div>

</div>

<div class="section">
  <div class="guide">
    <b>러프 제작 버전</b><br>
    편집 ON 상태에서는 바닥을 누르거나 드래그해 수정합니다.<br>
    카메라를 움직이려면 편집 OFF로 전환합니다.<br>
    추후 실제 배치도를 반투명 바닥 이미지로 깔고 그 위를 따라 제작할 수 있습니다.
  </div>
</div>

</aside>

<script type="module" src="./site-builder.js"></script>

</body>
</html>
