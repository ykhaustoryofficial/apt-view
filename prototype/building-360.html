<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HAUSTORY 360° Building V7</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  touch-action:none;
  overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif
}
#app{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 50% 12%,rgba(255,255,255,.96),transparent 40%),
    linear-gradient(180deg,#d8eaf0 0%,#bfd5dc 63%,#9caf98 100%)
}
canvas{display:block;width:100%;height:100%;touch-action:none}

.ui{position:fixed;inset:0;z-index:20;pointer-events:none}
.topbar{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  left:16px;right:16px;
  display:flex;align-items:center;justify-content:space-between
}
.title,.bottom,button{
  border:1px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.43);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 30px rgba(30,50,55,.08)
}
.title{padding:10px 14px;border-radius:16px;color:#24343b}
.title strong{display:block;font-size:14px}
.title span{display:block;margin-top:3px;font-size:9px;letter-spacing:.15em;opacity:.55}
.controls{display:flex;gap:7px;pointer-events:auto}
button{
  height:42px;padding:0 14px;border-radius:14px;
  color:#23343b;font:inherit;font-size:12px;font-weight:700
}
.bottom{
  position:absolute;left:50%;
  bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));
  transform:translateX(-50%);
  width:min(92vw,430px);
  padding:13px 16px;
  border-radius:18px;
  text-align:center;
  color:#283b41
}
.bottom strong{display:block;font-size:13px}
.bottom span{display:block;margin-top:4px;font-size:10px;opacity:.58}
.status{
  display:flex;justify-content:center;gap:13px;
  margin-top:7px;font-size:10px;font-weight:700;opacity:.7
}
</style>
</head>

<body>

<div id="app"></div>

<div class="ui">
  <div class="topbar">
    <div class="title">
      <strong>HAUSTORY · 25F</strong>
      <span>3D BUILDING MASSING V7</span>
    </div>

    <div class="controls">
      <button id="autoBtn">자동회전</button>
      <button id="resetBtn">정면</button>
    </div>
  </div>

  <div class="bottom">
    <strong>손가락으로 건물을 돌려보세요</strong>
    <span>좌우 회전 · 위아래 시점 · 두 손가락 확대/축소</span>

    <div class="status">
      <div id="degree">0°</div>
      <div id="zoomText">100%</div>
    </div>
  </div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

/* =========================================================
   DIMENSIONS
========================================================= */

const FLOOR_HEIGHT = .88;
const REGULAR_FLOORS = 24;

const BODY_HEIGHT =
  REGULAR_FLOORS * FLOOR_HEIGHT;

const TOP_FLOOR_HEIGHT = 1.18;

const ROOF_BASE_Y =
  BODY_HEIGHT + TOP_FLOOR_HEIGHT;

/* MAIN */

const MAIN_X = -.65;
const MAIN_WIDTH = 7.35;
const MAIN_DEPTH = 4.75;

/* RIGHT MASS */

const RIGHT_WIDTH = 3.05;
const RIGHT_DEPTH = 4.85;
const RIGHT_HEIGHT = BODY_HEIGHT - .15;

const RIGHT_X =
  MAIN_X +
  MAIN_WIDTH/2 +
  RIGHT_WIDTH/2 -
  .32;

const RIGHT_Z = .08;

/* BLUE CORE */

const BLUE_WIDTH = 4.38;
const BLUE_X = MAIN_X - .45;
const MAIN_FRONT = MAIN_DEPTH/2;

/* =========================================================
   NEW LEFT WHITE WALL
   기존 왼쪽 벽을 덮지 않고 바깥에 추가
========================================================= */

const LEFT_WALL_WIDTH = .46;

const LEFT_WALL_DEPTH =
  MAIN_DEPTH + .38;

const LEFT_WALL_HEIGHT =
  ROOF_BASE_Y;

const LEFT_WALL_X =
  MAIN_X -
  MAIN_WIDTH/2 -
  LEFT_WALL_WIDTH/2 +
  .06;

/* =========================================================
   SIGNATURE
========================================================= */

const CAP_WIDTH =
  MAIN_WIDTH + .72;

const CAP_DEPTH =
  MAIN_DEPTH + .38;

const CAP_X =
  MAIN_X;

const CAP_Z = 0;

const CAP_LEFT_HEIGHT = 1.05;
const CAP_RIGHT_HEIGHT = 1.72;

/* =========================================================
   SCENE
========================================================= */

const app =
  document.getElementById("app");

const scene =
  new THREE.Scene();

scene.fog =
  new THREE.Fog(
    0xd9e5e7,
    48,
    92
  );

/* CAMERA */

const camera =
  new THREE.PerspectiveCamera(
    34,
    innerWidth / innerHeight,
    .1,
    240
  );

let cameraDistance = 38;
let targetDistance = 38;

let cameraPitch = .10;
let targetPitch = .10;

/* RENDERER */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    alpha:true,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.10;

renderer.domElement.style.touchAction =
  "none";

app.appendChild(
  renderer.domElement
);

/* =========================================================
   LIGHT
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0xebf8ff,
    0x68755f,
    2.7
  )
);

const sun =
  new THREE.DirectionalLight(
    0xfff2dd,
    3.25
  );

sun.position.set(
  -14,
  30,
  18
);

sun.castShadow = true;

sun.shadow.mapSize.set(
  2048,
  2048
);

scene.add(sun);

const fill =
  new THREE.DirectionalLight(
    0xb8dbe9,
    1.45
  );

fill.position.set(
  18,
  15,
  -16
);

scene.add(fill);

/* =========================================================
   MATERIAL
========================================================= */

const MAT = {

  dark:
    new THREE.MeshStandardMaterial({
      color:0x303c43,
      roughness:.58
    }),

  dark2:
    new THREE.MeshStandardMaterial({
      color:0x45535a,
      roughness:.63
    }),

  white:
    new THREE.MeshStandardMaterial({
      color:0xe9ecea,
      roughness:.53
    }),

  whiteBright:
    new THREE.MeshStandardMaterial({
      color:0xf5f6f4,
      roughness:.44
    }),

  signatureWhite:
    new THREE.MeshStandardMaterial({
      color:0xf6f7f5,
      roughness:.42
    }),

  beige:
    new THREE.MeshStandardMaterial({
      color:0xb3a791,
      roughness:.68
    }),

  beigeDark:
    new THREE.MeshStandardMaterial({
      color:0x897d6d,
      roughness:.70
    }),

  blue:
    new THREE.MeshStandardMaterial({
      color:0x647ca5,
      roughness:.20,
      metalness:.06
    }),

  glass:
    new THREE.MeshStandardMaterial({
      color:0x879eaa,
      roughness:.22
    }),

  glassDark:
    new THREE.MeshStandardMaterial({
      color:0x65767e,
      roughness:.24
    }),

  lit:
    new THREE.MeshStandardMaterial({
      color:0xd3b679,
      emissive:0x86602d,
      emissiveIntensity:.72,
      roughness:.35
    }),

  metal:
    new THREE.MeshStandardMaterial({
      color:0x707b80,
      roughness:.34,
      metalness:.72
    })

};

/* =========================================================
   BUILDING GROUP
========================================================= */

const building =
  new THREE.Group();

scene.add(building);

/* =========================================================
   HELPERS
========================================================= */

function box(
  w,h,d,
  material,
  x,y,z
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material
    );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  building.add(mesh);

  return mesh;
}

function litPick(
  floor,
  column,
  side
){

  return (
    (
      floor*7 +
      column*11 +
      side*13
    ) % 31 === 0

    ||

    (
      floor*5 +
      column*3 +
      side*17
    ) % 43 === 0
  );
}

/* =========================================================
   MAIN BODY
========================================================= */

const mainBody =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      MAIN_WIDTH,
      BODY_HEIGHT,
      MAIN_DEPTH
    ),

    [
      MAT.dark2,
      MAT.dark2,
      MAT.dark,
      MAT.dark,
      MAT.dark,
      MAT.dark
    ]

  );

mainBody.position.set(
  MAIN_X,
  BODY_HEIGHT/2,
  0
);

mainBody.castShadow = true;
mainBody.receiveShadow = true;

building.add(mainBody);

/* =========================================================
   NEW LEFT WHITE WALL
========================================================= */

/*
  기존 건물의 왼쪽면 색을 바꾸는 것이 아니다.

  원래 메인 바디는 그대로 존재하고,
  그 바깥쪽에 별도의 흰색 벽체가 하나 추가된다.
*/

box(
  LEFT_WALL_WIDTH,
  LEFT_WALL_HEIGHT,
  LEFT_WALL_DEPTH,

  MAT.whiteBright,

  LEFT_WALL_X,

  LEFT_WALL_HEIGHT/2,

  0
);

/*
  앞쪽에서 조금 더 또렷하게 보이도록
  얇은 세로 마감재 추가
*/

box(
  .14,
  LEFT_WALL_HEIGHT,
  .20,

  MAT.signatureWhite,

  LEFT_WALL_X -
  LEFT_WALL_WIDTH/2 -
  .02,

  LEFT_WALL_HEIGHT/2,

  MAIN_FRONT + .13
);

/* =========================================================
   RIGHT BEIGE MASS
========================================================= */

const rightBody =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      RIGHT_WIDTH,
      RIGHT_HEIGHT,
      RIGHT_DEPTH
    ),

    [
      MAT.beigeDark,
      MAT.beigeDark,
      MAT.beige,
      MAT.beige,
      MAT.beige,
      MAT.beige
    ]

  );

rightBody.position.set(
  RIGHT_X,
  RIGHT_HEIGHT/2,
  RIGHT_Z
);

rightBody.castShadow = true;
rightBody.receiveShadow = true;

building.add(rightBody);

box(
  RIGHT_WIDTH+.10,
  .18,
  RIGHT_DEPTH+.10,

  MAT.dark2,

  RIGHT_X,

  RIGHT_HEIGHT+.09,

  RIGHT_Z
);

/* =========================================================
   BLUE CORE
========================================================= */

box(
  BLUE_WIDTH,
  BODY_HEIGHT-2.05,
  .07,

  MAT.blue,

  BLUE_X,

  (BODY_HEIGHT-2.05)/2 + 1.12,

  MAIN_FRONT+.04
);

/* WINDOWS */

const facadeColumns = [
  -1.50,
  -.50,
   .50,
  1.50
];

for(
  let floor=0;
  floor<21;
  floor++
){

  const y =
    2.30 +
    floor*.88;

  facadeColumns.forEach(
    (offset,column)=>{

      box(
        .82,
        .54,
        .10,

        litPick(
          floor,
          column,
          2
        )
          ? MAT.lit
          : MAT.glass,

        BLUE_X + offset,

        y,

        MAIN_FRONT+.11
      );

    }
  );
}

/* HORIZONTAL LINES */

for(
  let i=0;
  i<20;
  i++
){

  box(
    BLUE_WIDTH-.12,
    .055,
    .13,

    MAT.white,

    BLUE_X,

    2.72 + i*.88,

    MAIN_FRONT+.13
  );

}

/* =========================================================
   BIG WHITE FRAME
========================================================= */

const FRAME_LEFT_X =
  BLUE_X -
  BLUE_WIDTH/2 -
  .22;

const FRAME_RIGHT_X =
  BLUE_X +
  BLUE_WIDTH/2 +
  .22;

const FRAME_BOTTOM = .10;

const FRAME_TOP =
  BODY_HEIGHT-.20;

const FRAME_HEIGHT =
  FRAME_TOP -
  FRAME_BOTTOM;

box(
  .32,
  FRAME_HEIGHT,
  .21,

  MAT.whiteBright,

  FRAME_LEFT_X,

  FRAME_BOTTOM +
  FRAME_HEIGHT/2,

  MAIN_FRONT+.17
);

box(
  .32,
  FRAME_HEIGHT,
  .21,

  MAT.whiteBright,

  FRAME_RIGHT_X,

  FRAME_BOTTOM +
  FRAME_HEIGHT/2,

  MAIN_FRONT+.17
);

box(
  FRAME_RIGHT_X -
  FRAME_LEFT_X +
  .32,

  .22,

  .21,

  MAT.whiteBright,

  (
    FRAME_LEFT_X +
    FRAME_RIGHT_X
  )/2,

  FRAME_TOP,

  MAIN_FRONT+.17
);

/* =========================================================
   LEFT WINDOW STRIP
========================================================= */

for(
  let floor=0;
  floor<22;
  floor++
){

  box(
    .55,
    .52,
    .08,

    litPick(
      floor,1,5
    )
      ? MAT.lit
      : MAT.glassDark,

    MAIN_X -
    MAIN_WIDTH/2 +
    .38,

    1.20 +
    floor*.88,

    MAIN_FRONT+.10
  );

}

/* =========================================================
   RIGHT MASS WINDOWS
========================================================= */

for(
  let floor=0;
  floor<21;
  floor++
){

  const y =
    1.45 +
    floor*.88;

  for(
    let c=0;
    c<2;
    c++
  ){

    box(
      .76,
      .54,
      .09,

      litPick(
        floor,c,9
      )
        ? MAT.lit
        : MAT.glass,

      RIGHT_X -
      .55 +
      c*1.13,

      y,

      RIGHT_Z +
      RIGHT_DEPTH/2 +
      .09
    );

  }

}

for(
  let floor=0;
  floor<21;
  floor++
){

  const y =
    1.45 +
    floor*.88;

  for(
    let c=0;
    c<3;
    c++
  ){

    box(
      .09,
      .54,
      .66,

      litPick(
        floor,c,10
      )
        ? MAT.lit
        : MAT.glassDark,

      RIGHT_X +
      RIGHT_WIDTH/2 +
      .08,

      y,

      RIGHT_Z -
      1.18 +
      c*1.05
    );

  }

}

/* =========================================================
   TOP FLOOR
========================================================= */

box(
  MAIN_WIDTH,
  TOP_FLOOR_HEIGHT,
  MAIN_DEPTH,

  MAT.dark2,

  MAIN_X,

  BODY_HEIGHT +
  TOP_FLOOR_HEIGHT/2,

  0
);

for(
  let i=0;
  i<6;
  i++
){

  box(
    .80,
    .75,
    .10,

    i%3===0
      ? MAT.lit
      : MAT.glass,

    MAIN_X -
    2.55 +
    i*1.02,

    BODY_HEIGHT +
    TOP_FLOOR_HEIGHT*.50,

    MAIN_FRONT+.11
  );

}

/* =========================================================
   WHITE SIGNATURE BASE
   상단 구조물이 본체와 연결되어 보이도록
   하부도 전부 흰색
========================================================= */

box(
  CAP_WIDTH,
  .18,
  CAP_DEPTH,

  MAT.signatureWhite,

  CAP_X,

  ROOF_BASE_Y+.09,

  CAP_Z
);

/* =========================================================
   SIGNATURE WEDGE
========================================================= */

function createSignatureWedge(){

  const w =
    CAP_WIDTH;

  const d =
    CAP_DEPTH;

  const leftH =
    CAP_LEFT_HEIGHT;

  const rightH =
    CAP_RIGHT_HEIGHT;


  const positions =
    new Float32Array([

      -w/2,0,d/2,
       w/2,0,d/2,

      -w/2,leftH,d/2,
       w/2,rightH,d/2,

      -w/2,0,-d/2,
       w/2,0,-d/2,

      -w/2,leftH,-d/2,
       w/2,rightH,-d/2

    ]);


  const indices = [

    0,1,3,
    0,3,2,

    5,4,6,
    5,6,7,

    4,0,2,
    4,2,6,

    1,5,7,
    1,7,3,

    4,5,1,
    4,1,0,

    2,3,7,
    2,7,6

  ];


  const geometry =
    new THREE.BufferGeometry();


  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );


  geometry.setIndex(
    indices
  );


  geometry.computeVertexNormals();


  const wedge =
    new THREE.Mesh(
      geometry,
      MAT.signatureWhite
    );


  wedge.position.set(
    CAP_X,
    ROOF_BASE_Y+.18,
    CAP_Z
  );


  wedge.castShadow = true;
  wedge.receiveShadow = true;


  building.add(
    wedge
  );

}

createSignatureWedge();

/* =========================================================
   LOGO
========================================================= */

function createLogoTexture(){

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width = 1024;
  canvas.height = 256;

  const ctx =
    canvas.getContext(
      "2d"
    );

  ctx.font =
    "900 124px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =

    "HAUSTORY",

  );

  );

const logoMaterial =
  new THREE.MeshBasicMaterial({
    map:createLogoTexture(),
    transparent:true
  });


const logo =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      5.20,
      1.22
    ),

    logoMaterial

  );


logo.position.set(

  CAP_X+.20,

  ROOF_BASE_Y+.18 +
  (
    CAP_LEFT_HEIGHT +
    CAP_RIGHT_HEIGHT
  )/2*.56,

  CAP_DEPTH/2+.012

);


building.add(
  logo
);

/* =========================================================
   SOLAR PANEL TEXTURE
========================================================= */

function solarTexture(){

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width = 512;
  canvas.height = 768;

  const ctx =
    canvas.getContext(
      "2d"
    );


  const gradient =
    ctx.createLinearGradient(
      0,0,
      512,768
    );


  gradient.addColorStop(
    0,
    "#315d78"
  );

  gradient.addColorStop(
    .5,
    "#173c55"
  );

  gradient.addColorStop(
    1,
    "#0d2a40"
  );


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    0,0,
    512,768
  );


  const cols = 6;
  const rows = 10;

  const cw =
    512/cols;

  const ch =
    768/rows;


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const x =
        c*cw;

      const y =
        r*ch;


      ctx.strokeStyle =
        "rgba(170,215,230,.30)";

      ctx.lineWidth = 2;


      ctx.strokeRect(
        x+3,
        y+3,
        cw-6,
        ch-6
      );


      ctx.strokeStyle =
        "rgba(220,235,240,.18)";

      ctx.lineWidth = 1;


      ctx.beginPath();


      ctx.moveTo(
        x+cw*.36,
        y+5
      );


      ctx.lineTo(
        x+cw*.36,
        y+ch-5
      );


      ctx.moveTo(
        x+cw*.64,
        y+5
      );


      ctx.lineTo(
        x+cw*.64,
        y+ch-5
      );


      ctx.stroke();

    }

  }


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.colorSpace =
    THREE.SRGBColorSpace;


  texture.anisotropy =
    renderer.capabilities
    .getMaxAnisotropy();


  return texture;

}


const solarMaterial =
  new THREE.MeshStandardMaterial({
    map:solarTexture(),
    roughness:.18,
    metalness:.10
  });

/* =========================================================
   SOLAR MODULE
========================================================= */

function solarModule(
  width=1.02,
  depth=1.35
){

  const group =
    new THREE.Group();


  const back =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        width,
        .055,
        depth
      ),

      MAT.metal

    );


  back.castShadow = true;


  group.add(
    back
  );


  const surface =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        width-.07,
        depth-.07
      ),

      solarMaterial

    );


  surface.rotation.x =
    -Math.PI/2;


  surface.position.y =
    .031;


  group.add(
    surface
  );


  const h = .07;
  const t = .045;


  const north =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        width,h,t
      ),

      MAT.metal

    );


  north.position.set(
    0,.035,-depth/2
  );


  group.add(
    north
  );


  const south =
    north.clone();


  south.position.z =
    depth/2;


  group.add(
    south
  );


  const west =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        t,h,depth
      ),

      MAT.metal

    );


  west.position.set(
    -width/2,.035,0
  );


  group.add(
    west
  );


  const east =
    west.clone();


  east.position.x =
    width/2;


  group.add(
    east
  );


  return group;

}

/* =========================================================
   SOLAR ARRAY
========================================================= */

function createRoofSolar(){

  const group =
    new THREE.Group();


  const columns = 5;
  const rows = 2;

  const panelW = 1.03;
  const panelD = 1.25;
  const gap = .075;


  const totalW =
    columns*panelW +
    (columns-1)*gap;


  const totalD =
    rows*panelD +
    (rows-1)*gap;


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<columns;
      c++
    ){

      const panel =
        solarModule(
          panelW,
          panelD
        );


      panel.position.x =
        -totalW/2 +
        panelW/2 +
        c*(panelW+gap);


      panel.position.z =
        -totalD/2 +
        panelD/2 +
        r*(panelD+gap);


      group.add(
        panel
      );

    }

  }


  const slope =
    Math.atan2(
      CAP_RIGHT_HEIGHT -
      CAP_LEFT_HEIGHT,
      CAP_WIDTH
    );


  group.rotation.z =
    slope;


  group.position.set(

    CAP_X,

    ROOF_BASE_Y+.18 +
    (
      CAP_LEFT_HEIGHT +
      CAP_RIGHT_HEIGHT
    )/2
    + .10,

    CAP_Z

  );


  building.add(
    group
  );

}


createRoofSolar();

/* =========================================================
   GROUND
========================================================= */

const ground =
  new THREE.Mesh(

    new THREE.CircleGeometry(
      34,
      96
    ),

    new THREE.MeshStandardMaterial({
      color:0x91a58c,
      roughness:1
    })

  );


ground.rotation.x =
  -Math.PI/2;


ground.receiveShadow =
  true;


scene.add(
  ground
);

/* =========================================================
   INTERACTION
========================================================= */

let rotationY = 0;
let targetRotationY = 0;

let autoRotate = true;

const pointers =
  new Map();

let previousX = 0;
let previousY = 0;
let previousPinch = null;


renderer.domElement.addEventListener(
  "pointerdown",
  event=>{

    autoRotate = false;

    pointers.set(
      event.pointerId,
      {
        x:event.clientX,
        y:event.clientY
      }
    );


    renderer.domElement.setPointerCapture(
      event.pointerId
    );


    if(
      pointers.size===1
    ){

      previousX =
        event.clientX;

      previousY =
        event.clientY;

    }


    if(
      pointers.size===2
    ){

      const p =
        [...pointers.values()];


      previousPinch =
        Math.hypot(
          p[1].x-p[0].x,
          p[1].y-p[0].y
        );

    }

  }
);


renderer.domElement.addEventListener(
  "pointermove",
  event=>{

    if(
      !pointers.has(
        event.pointerId
      )
    ){
      return;
    }


    pointers.set(
      event.pointerId,
      {
        x:event.clientX,
        y:event.clientY
      }
    );


    if(
      pointers.size===1
    ){

      const dx =
        event.clientX -
        previousX;


      const dy =
        event.clientY -
        previousY;


      targetRotationY +=
        dx*.009;


      targetPitch +=
        dy*.0035;


      targetPitch =
        THREE.MathUtils.clamp(
          targetPitch,
          -.10,
          .60
        );


      previousX =
        event.clientX;


      previousY =
        event.clientY;

    }


    if(
      pointers.size===2
    ){

      const p =
        [...pointers.values()];


      const distance =
        Math.hypot(
          p[1].x-p[0].x,
          p[1].y-p[0].y
        );


      if(
        previousPinch!==null
      ){

        const diff =
          distance -
          previousPinch;


        targetDistance -=
          diff*.09;


        targetDistance =
          THREE.MathUtils.clamp(
            targetDistance,
            16,
            72
          );

      }


      previousPinch =
        distance;

    }

  }
);


function removePointer(event){

  pointers.delete(
    event.pointerId
  );


  previousPinch =
    null;


  if(
    pointers.size===1
  ){

    const p =
      [...pointers.values()][0];


    previousX = p.x;
    previousY = p.y;

  }

}


renderer.domElement.addEventListener(
  "pointerup",
  removePointer
);


renderer.domElement.addEventListener(
  "pointercancel",
  removePointer
);

/* =========================================================
   UI
========================================================= */

const resetBtn =
  document.getElementById(
    "resetBtn"
  );


const autoBtn =
  document.getElementById(
    "autoBtn"
  );


const degree =
  document.getElementById(
    "degree"
  );


const zoomText =
  document.getElementById(
    "zoomText"
  );


resetBtn.addEventListener(
  "click",
  ()=>{

    autoRotate = false;

    targetRotationY = 0;

    targetPitch = .10;

    targetDistance = 38;

    autoBtn.textContent =
      "자동회전";

  }
);


autoBtn.addEventListener(
  "click",
  ()=>{

    autoRotate =
      !autoRotate;


    autoBtn.textContent =
      autoRotate
      ? "자동회전 중"
      : "자동회전";

  }
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth /
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

/* =========================================================
   ANIMATION
========================================================= */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if(
    autoRotate
  ){

    targetRotationY +=
      delta*.22;

  }


  rotationY =
    THREE.MathUtils.lerp(
      rotationY,
      targetRotationY,
      .09
    );


  cameraPitch =
    THREE.MathUtils.lerp(
      cameraPitch,
      targetPitch,
      .09
    );


  cameraDistance =
    THREE.MathUtils.lerp(
      cameraDistance,
      targetDistance,
      .11
    );


  building.rotation.y =
    rotationY;


  const lookY =
    ROOF_BASE_Y*.47;


  const horizontal =
    cameraDistance *
    Math.cos(
      cameraPitch
    );


  camera.position.set(

    0,

    lookY +
    cameraDistance *
    Math.sin(
      cameraPitch
    ),

    horizontal

  );


  camera.lookAt(
    0,
    lookY,
    0
  );


  let deg =
    THREE.MathUtils.radToDeg(
      rotationY
    );


  deg =
    ((deg%360)+360)%360;


  degree.textContent =
    `${Math.round(deg)}°`;


  zoomText.textContent =
    `${Math.round(
      38 /
      cameraDistance *
      100
    )}%`;


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>
