<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>HAUSTORY 360° Building</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  touch-action:none;
  overscroll-behavior:none;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Pretendard",
  "Apple SD Gothic Neo",
  sans-serif;
}

#app{
  position:fixed;
  inset:0;

  background:
  radial-gradient(
    circle at 50% 13%,
    rgba(255,255,255,.95),
    transparent 39%
  ),
  linear-gradient(
    180deg,
    #d8eaf0 0%,
    #bfd5dc 62%,
    #9caf98 100%
  );
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

.ui{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
}

.topbar{
  position:absolute;

  top:max(14px,env(safe-area-inset-top));
  left:16px;
  right:16px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title,
.bottom,
button{
  border:1px solid rgba(255,255,255,.55);

  background:
  rgba(255,255,255,.43);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:
  0 10px 30px rgba(30,50,55,.08);
}

.title{
  padding:10px 14px;
  border-radius:16px;
  color:#24343b;
}

.title strong{
  display:block;
  font-size:14px;
}

.title span{
  display:block;
  margin-top:3px;

  font-size:9px;
  letter-spacing:.15em;
  opacity:.55;
}

.controls{
  display:flex;
  gap:7px;
  pointer-events:auto;
}

button{
  height:42px;
  padding:0 14px;

  border-radius:14px;

  color:#23343b;

  font:inherit;
  font-size:12px;
  font-weight:700;
}

.bottom{
  position:absolute;

  left:50%;

  bottom:max(
    18px,
    calc(env(safe-area-inset-bottom) + 10px)
  );

  transform:translateX(-50%);

  width:min(92vw,430px);

  padding:13px 16px;

  border-radius:18px;

  color:#283b41;
  text-align:center;
}

.bottom strong{
  display:block;
  font-size:13px;
}

.bottom span{
  display:block;

  margin-top:4px;

  font-size:10px;
  opacity:.58;
}

.status{
  display:flex;
  justify-content:center;
  gap:13px;

  margin-top:7px;

  font-size:10px;
  font-weight:700;
  opacity:.7;
}
</style>
</head>

<body>

<div id="app"></div>

<div class="ui">

  <div class="topbar">

    <div class="title">
      <strong>HAUSTORY · 25F</strong>
      <span>3D BUILDING PROTOTYPE</span>
    </div>

    <div class="controls">
      <button id="autoBtn">자동회전</button>
      <button id="resetBtn">정면</button>
    </div>

  </div>

  <div class="bottom">

    <strong>
      손가락으로 건물을 돌려보세요
    </strong>

    <span>
      한 손가락 회전 · 두 손가락 확대/축소
    </span>

    <div class="status">
      <div id="degree">0°</div>
      <div id="zoomText">100%</div>
    </div>

  </div>

</div>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


/* =========================================================
   BUILDING CONFIG
========================================================= */

const TOTAL_FLOORS = 25;

const FLOOR_HEIGHT = .9;

const BUILDING_WIDTH = 10;

const BUILDING_DEPTH = 5.8;

const REGULAR_FLOORS =
TOTAL_FLOORS - 1;

const BODY_HEIGHT =
REGULAR_FLOORS * FLOOR_HEIGHT;

const TOP_FLOOR_HEIGHT = 1.25;

const TOTAL_HEIGHT =
BODY_HEIGHT + TOP_FLOOR_HEIGHT;


/* =========================================================
   SCENE
========================================================= */

const app =
document.getElementById("app");

const scene =
new THREE.Scene();

scene.fog =
new THREE.Fog(
  0xd9e5e7,
  48,
  88
);


/* =========================================================
   CAMERA
========================================================= */

const camera =
new THREE.PerspectiveCamera(
  34,
  window.innerWidth / window.innerHeight,
  .1,
  200
);

let cameraDistance = 42;

let targetDistance = 42;


/* =========================================================
   RENDERER
========================================================= */

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
1.12;

renderer.domElement.style.touchAction =
"none";

app.appendChild(
  renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0xebf8ff,
    0x68755f,
    2.6
  )
);


const sun =
new THREE.DirectionalLight(
  0xfff2dd,
  3.3
);

sun.position.set(
  -14,
  30,
  18
);

sun.castShadow = true;

sun.shadow.mapSize.set(
  2048,
  2048
);

sun.shadow.camera.left = -22;
sun.shadow.camera.right = 22;
sun.shadow.camera.top = 38;
sun.shadow.camera.bottom = -12;

scene.add(sun);


const fill =
new THREE.DirectionalLight(
  0xb9dbe9,
  1.45
);

fill.position.set(
  18,
  12,
  -15
);

scene.add(fill);


/* =========================================================
   MATERIALS
========================================================= */

const MAT = {

  dark:
  new THREE.MeshStandardMaterial({
    color:0x323e44,
    roughness:.57
  }),

  side:
  new THREE.MeshStandardMaterial({
    color:0x46555b,
    roughness:.63
  }),

  white:
  new THREE.MeshStandardMaterial({
    color:0xe9edeb,
    roughness:.53
  }),

  brightWhite:
  new THREE.MeshStandardMaterial({
    color:0xf4f5f3,
    roughness:.44
  }),

  roof:
  new THREE.MeshStandardMaterial({
    color:0xb6bfbd,
    roughness:.75
  }),

  roofFloor:
  new THREE.MeshStandardMaterial({
    color:0xb8c0bd,
    roughness:.86
  }),

  glass:
  new THREE.MeshStandardMaterial({
    color:0x637981,
    roughness:.22,
    metalness:.08
  }),

  lit:
  new THREE.MeshStandardMaterial({
    color:0xd4b273,
    emissive:0x89602c,
    emissiveIntensity:.75,
    roughness:.35
  }),

  rail:
  new THREE.MeshStandardMaterial({
    color:0x1e292e,
    roughness:.5,
    metalness:.2
  }),

  solarFrame:
  new THREE.MeshStandardMaterial({
    color:0x667178,
    roughness:.33,
    metalness:.72
  }),

  solarRail:
  new THREE.MeshStandardMaterial({
    color:0x879096,
    roughness:.36,
    metalness:.78
  })

};


/* =========================================================
   BUILDING GROUP
========================================================= */

const building =
new THREE.Group();

scene.add(building);


/* =========================================================
   HELPERS
========================================================= */

function box(
  w,h,d,
  material,
  x,y,z,
  parent=building
){

  const mesh =
  new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  parent.add(mesh);

  return mesh;
}


/* =========================================================
   MAIN BODY
========================================================= */

const body =
new THREE.Mesh(

  new THREE.BoxGeometry(
    BUILDING_WIDTH,
    BODY_HEIGHT,
    BUILDING_DEPTH
  ),

  [
    MAT.side,
    MAT.side,
    MAT.dark,
    MAT.dark,
    MAT.dark,
    MAT.dark
  ]

);

body.position.y =
BODY_HEIGHT / 2;

body.castShadow = true;
body.receiveShadow = true;

building.add(body);


/* =========================================================
   TOP FLOOR
========================================================= */

box(
  BUILDING_WIDTH,
  TOP_FLOOR_HEIGHT,
  BUILDING_DEPTH,

  MAT.dark,

  0,
  BODY_HEIGHT + TOP_FLOOR_HEIGHT / 2,
  0
);


/* =========================================================
   VERTICAL WHITE FRAMES
========================================================= */

[
  -4.55,
  -1.65,
  1.65,
  4.55

].forEach(x=>{

  box(
    .48,
    TOTAL_HEIGHT + .25,
    .22,

    MAT.brightWhite,

    x,
    TOTAL_HEIGHT / 2,
    BUILDING_DEPTH / 2 + .12
  );


  box(
    .48,
    TOTAL_HEIGHT + .25,
    .22,

    MAT.brightWhite,

    x,
    TOTAL_HEIGHT / 2,
    -BUILDING_DEPTH / 2 - .12
  );

});


/* =========================================================
   SIDE EDGE FRAMES
========================================================= */

[
  -BUILDING_DEPTH / 2 + .22,
  BUILDING_DEPTH / 2 - .22

].forEach(z=>{

  box(
    .2,
    TOTAL_HEIGHT + .3,
    .45,

    MAT.white,

    -BUILDING_WIDTH/2 - .1,
    TOTAL_HEIGHT/2,
    z
  );


  box(
    .2,
    TOTAL_HEIGHT + .3,
    .45,

    MAT.white,

    BUILDING_WIDTH/2 + .1,
    TOTAL_HEIGHT/2,
    z
  );

});


/* =========================================================
   WINDOWS
========================================================= */

function shouldLight(
  floor,
  column,
  side
){

  return (

    (
      floor*7 +
      column*11 +
      side*17
    ) % 29 === 0

    ||

    (
      floor*5 +
      column*3 +
      side*13
    ) % 41 === 0

  );
}


const frontColumns = [

  -3.75,
  -2.55,
  -.75,
  .75,
  2.55,
  3.75

];


for(
  let floor=0;
  floor<REGULAR_FLOORS;
  floor++
){

  const y =
  floor * FLOOR_HEIGHT +
  FLOOR_HEIGHT*.52;


  frontColumns.forEach(
    (x,column)=>{

      box(
        .82,.52,.11,

        shouldLight(
          floor,column,0
        )
        ? MAT.lit
        : MAT.glass,

        x,
        y,
        BUILDING_DEPTH/2+.13
      );


      box(
        .82,.52,.11,

        shouldLight(
          floor,column,1
        )
        ? MAT.lit
        : MAT.glass,

        x,
        y,
        -BUILDING_DEPTH/2-.13
      );

    }
  );

}


/* =========================================================
   SIDE WINDOWS
========================================================= */

const sideColumns = [
  -1.75,
  0,
  1.75
];


for(
  let floor=0;
  floor<REGULAR_FLOORS;
  floor++
){

  const y =
  floor*FLOOR_HEIGHT +
  FLOOR_HEIGHT*.52;


  sideColumns.forEach(
    (z,column)=>{

      box(
        .11,.52,.88,

        shouldLight(
          floor,column,2
        )
        ? MAT.lit
        : MAT.glass,

        BUILDING_WIDTH/2+.13,
        y,
        z
      );


      box(
        .11,.52,.88,

        shouldLight(
          floor,column,3
        )
        ? MAT.lit
        : MAT.glass,

        -BUILDING_WIDTH/2-.13,
        y,
        z
      );

    }
  );

}


/* =========================================================
   HORIZONTAL BANDS
========================================================= */

[
  6.3,
  12.6,
  18

].forEach(y=>{

  box(
    BUILDING_WIDTH+.1,
    .16,
    .22,

    MAT.white,

    0,
    y,
    BUILDING_DEPTH/2+.13
  );


  box(
    BUILDING_WIDTH+.1,
    .16,
    .22,

    MAT.white,

    0,
    y,
    -BUILDING_DEPTH/2-.13
  );

});


/* =========================================================
   TOP FLOOR WINDOWS
========================================================= */

const topY =
BODY_HEIGHT + .63;


[
  -3.8,
  -2.25,
  -.75,
  .75,
  2.25,
  3.8

].forEach(x=>{

  box(
    1.12,.88,.13,

    MAT.glass,

    x,
    topY,
    BUILDING_DEPTH/2+.15
  );


  box(
    1.12,.88,.13,

    MAT.glass,

    x,
    topY,
    -BUILDING_DEPTH/2-.15
  );

});


/* =========================================================
   FLAT ROOFTOP DECK
========================================================= */

box(
  BUILDING_WIDTH - .55,
  .16,
  BUILDING_DEPTH - .5,

  MAT.roofFloor,

  0,
  TOTAL_HEIGHT + .08,
  0
);


/* =========================================================
   SIGNATURE PARAPET
   통짜 지붕이 아니라 얇은 전면/후면 벽
========================================================= */

function signatureWall(z){

  const width =
  BUILDING_WIDTH + .5;

  const h = 2.05;

  const thickness = .22;


  const shape =
  new THREE.Shape();


  shape.moveTo(
    -width/2,
    0
  );

  shape.lineTo(
    width/2,
    0
  );

  shape.lineTo(
    width/2,
    h
  );

  shape.lineTo(
    -width/2,
    h*.56
  );

  shape.closePath();


  const geometry =
  new THREE.ExtrudeGeometry(
    shape,
    {
      depth:thickness,
      bevelEnabled:false
    }
  );


  geometry.translate(
    0,
    0,
    -thickness/2
  );


  const mesh =
  new THREE.Mesh(
    geometry,
    MAT.brightWhite
  );


  mesh.position.set(
    0,
    TOTAL_HEIGHT,
    z
  );


  mesh.castShadow = true;
  mesh.receiveShadow = true;


  building.add(mesh);

}


signatureWall(
  BUILDING_DEPTH/2 + .15
);

signatureWall(
  -BUILDING_DEPTH/2 - .15
);


/* =========================================================
   SIDE ROOF PARAPETS
========================================================= */

box(
  .24,
  1.15,
  BUILDING_DEPTH+.25,

  MAT.white,

  -BUILDING_WIDTH/2-.1,
  TOTAL_HEIGHT+.58,
  0
);


box(
  .24,
  1.95,
  BUILDING_DEPTH+.25,

  MAT.white,

  BUILDING_WIDTH/2+.1,
  TOTAL_HEIGHT+.98,
  0
);


/* =========================================================
   HAUSTORY LOGO
========================================================= */

function logoTexture(){

  const canvas =
  document.createElement("canvas");

  canvas.width = 1024;
  canvas.height = 256;


  const ctx =
  canvas.getContext("2d");


  ctx.font =
  "900 124px Arial";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";


  ctx.fillStyle =
  "rgba(0,0,0,.18)";

  ctx.fillText(
    "HAUSTORY",
    516,
    143
  );


  ctx.fillStyle =
  "#273238";

  ctx.fillText(
    "HAUSTORY",
    512,
    132
  );


  const texture =
  new THREE.CanvasTexture(canvas);

  texture.colorSpace =
  THREE.SRGBColorSpace;

  return texture;
}


const logoMat =
new THREE.MeshBasicMaterial({
  map:logoTexture(),
  transparent:true
});


const frontLogo =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    6.5,
    1.6
  ),
  logoMat
);


frontLogo.position.set(
  1.05,
  TOTAL_HEIGHT + 1.02,
  BUILDING_DEPTH/2 + .28
);

building.add(frontLogo);


const backLogo =
frontLogo.clone();

backLogo.position.z =
-BUILDING_DEPTH/2 - .28;

backLogo.rotation.y =
Math.PI;

building.add(backLogo);


/* =========================================================
   ROOFTOP MACHINE ROOM
========================================================= */

box(
  2.25,
  .82,
  1.75,

  MAT.roof,

  3.05,
  TOTAL_HEIGHT+.54,
  -1.1
);


/* =========================================================
   SOLAR CELL TEXTURE
========================================================= */

function createSolarCellTexture(){

  const canvas =
  document.createElement("canvas");

  canvas.width = 512;
  canvas.height = 768;


  const ctx =
  canvas.getContext("2d");


  const grad =
  ctx.createLinearGradient(
    0,
    0,
    canvas.width,
    canvas.height
  );


  grad.addColorStop(
    0,
    "#284b63"
  );

  grad.addColorStop(
    .45,
    "#17384f"
  );

  grad.addColorStop(
    1,
    "#102d42"
  );


  ctx.fillStyle = grad;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const cols = 6;

  const rows = 10;


  const cellW =
  canvas.width / cols;

  const cellH =
  canvas.height / rows;


  for(
    let row=0;
    row<rows;
    row++
  ){

    for(
      let col=0;
      col<cols;
      col++
    ){

      const x =
      col*cellW;

      const y =
      row*cellH;


      ctx.strokeStyle =
      "rgba(160,205,225,.30)";

      ctx.lineWidth = 2;


      ctx.strokeRect(
        x+3,
        y+3,
        cellW-6,
        cellH-6
      );


      const cellGrad =
      ctx.createLinearGradient(
        x,
        y,
        x+cellW,
        y+cellH
      );


      cellGrad.addColorStop(
        0,
        "rgba(100,160,190,.19)"
      );

      cellGrad.addColorStop(
        .5,
        "rgba(20,65,90,.08)"
      );

      cellGrad.addColorStop(
        1,
        "rgba(5,25,40,.20)"
      );


      ctx.fillStyle =
      cellGrad;


      ctx.fillRect(
        x+4,
        y+4,
        cellW-8,
        cellH-8
      );


      /*
        실제 모듈의 얇은 버스바
      */

      ctx.strokeStyle =
      "rgba(200,225,235,.22)";

      ctx.lineWidth = 1;


      ctx.beginPath();

      ctx.moveTo(
        x+cellW*.36,
        y+5
      );

      ctx.lineTo(
        x+cellW*.36,
        y+cellH-5
      );

      ctx.moveTo(
        x+cellW*.64,
        y+5
      );

      ctx.lineTo(
        x+cellW*.64,
        y+cellH-5
      );

      ctx.stroke();

    }

  }


  /*
    유리 반사
  */

  const glare =
  ctx.createLinearGradient(
    0,
    0,
    canvas.width,
    canvas.height
  );


  glare.addColorStop(
    0,
    "rgba(255,255,255,.20)"
  );

  glare.addColorStop(
    .26,
    "rgba(255,255,255,.03)"
  );

  glare.addColorStop(
    .55,
    "rgba(255,255,255,0)"
  );


  ctx.fillStyle = glare;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const texture =
  new THREE.CanvasTexture(canvas);


  texture.colorSpace =
  THREE.SRGBColorSpace;


  texture.anisotropy =
  renderer.capabilities
  .getMaxAnisotropy();


  return texture;

}


const solarCellMaterial =
new THREE.MeshStandardMaterial({

  map:createSolarCellTexture(),

  roughness:.18,

  metalness:.12

});


/* =========================================================
   ONE REALISTIC SOLAR MODULE
========================================================= */

function createSolarModule(
  moduleWidth=1.02,
  moduleDepth=1.62
){

  const module =
  new THREE.Group();


  /*
    뒷판
  */

  const back =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      moduleWidth,
      .055,
      moduleDepth
    ),

    MAT.solarFrame

  );


  back.castShadow = true;

  module.add(back);


  /*
    태양전지 유리면
  */

  const surface =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      moduleWidth-.075,
      moduleDepth-.075
    ),

    solarCellMaterial

  );


  surface.rotation.x =
  -Math.PI/2;


  surface.position.y =
  .031;


  module.add(surface);


  /*
    알루미늄 외곽 프레임
  */

  const frameHeight = .075;

  const frameThickness = .045;


  const topFrame =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      moduleWidth,
      frameHeight,
      frameThickness
    ),

    MAT.solarFrame

  );


  topFrame.position.set(
    0,
    .035,
    -moduleDepth/2
  );


  module.add(topFrame);


  const bottomFrame =
  topFrame.clone();


  bottomFrame.position.z =
  moduleDepth/2;


  module.add(bottomFrame);


  const leftFrame =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      frameThickness,
      frameHeight,
      moduleDepth
    ),

    MAT.solarFrame

  );


  leftFrame.position.set(
    -moduleWidth/2,
    .035,
    0
  );


  module.add(leftFrame);


  const rightFrame =
  leftFrame.clone();


  rightFrame.position.x =
  moduleWidth/2;


  module.add(rightFrame);


  return module;

}


/* =========================================================
   SOLAR ARRAY
========================================================= */

function createSolarArray({

  x=0,
  z=0,

  columns=4,
  rows=2,

  moduleWidth=1.02,
  moduleDepth=1.62,

  gap=.10,

  tilt=4

}){

  const array =
  new THREE.Group();


  const totalWidth =
  columns*moduleWidth +
  (columns-1)*gap;


  const totalDepth =
  rows*moduleDepth +
  (rows-1)*gap;


  /*
    실제 하부 장착 레일
  */

  for(
    let row=0;
    row<=rows;
    row++
  ){

    const rail =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        totalWidth+.15,
        .055,
        .055
      ),

      MAT.solarRail

    );


    rail.position.set(
      0,
      -.09,
      -totalDepth/2 +
      row*(totalDepth/rows)
    );


    array.add(rail);

  }


  /*
    개별 모듈
  */

  for(
    let row=0;
    row<rows;
    row++
  ){

    for(
      let col=0;
      col<columns;
      col++
    ){

      const panel =
      createSolarModule(
        moduleWidth,
        moduleDepth
      );


      panel.position.x =

      -totalWidth/2 +
      moduleWidth/2 +
      col*(moduleWidth+gap);


      panel.position.z =

      -totalDepth/2 +
      moduleDepth/2 +
      row*(moduleDepth+gap);


      array.add(panel);

    }

  }


  /*
    얕은 실제 설치각
  */

  array.rotation.x =
  THREE.MathUtils.degToRad(
    -tilt
  );


  array.position.set(

    x,

    TOTAL_HEIGHT + .36,

    z

  );


  building.add(array);


  /*
    지붕 고정용 받침대
  */

  const legPositions = [

    [-totalWidth*.42,-totalDepth*.38],

    [ totalWidth*.42,-totalDepth*.38],

    [-totalWidth*.42, totalDepth*.38],

    [ totalWidth*.42, totalDepth*.38]

  ];


  legPositions.forEach(
    ([lx,lz])=>{

      box(
        .08,
        .24,
        .08,

        MAT.solarRail,

        x+lx,
        TOTAL_HEIGHT+.22,
        z+lz
      );

    }
  );

}


/* =========================================================
   ROOFTOP PANEL PLACEMENT

   실제 조감도처럼 긴 배열 + 보조 배열
========================================================= */

createSolarArray({

  x:-1.45,

  z:-.25,

  columns:4,

  rows:2,

  moduleWidth:.94,

  moduleDepth:1.52,

  gap:.09,

  tilt:4

});


createSolarArray({

  x:2.55,

  z:.72,

  columns:2,

  rows:1,

  moduleWidth:.92,

  moduleDepth:1.48,

  gap:.09,

  tilt:4

});


/* =========================================================
   GROUND
========================================================= */

const ground =
new THREE.Mesh(

  new THREE.CircleGeometry(
    32,
    96
  ),

  new THREE.MeshStandardMaterial({
    color:0x91a58c,
    roughness:1
  })

);


ground.rotation.x =
-Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   INTERACTION STATE
========================================================= */

let rotationY = 0;

let rotationX = -.04;

let targetRotationY = 0;

let targetRotationX = -.04;

let autoRotate = true;


const activePointers =
new Map();


let previousX = 0;

let previousY = 0;

let previousPinchDistance = null;


/* =========================================================
   POINTER DOWN
========================================================= */

renderer.domElement.addEventListener(
  "pointerdown",
  event=>{

    autoRotate = false;


    activePointers.set(
      event.pointerId,
      {
        x:event.clientX,
        y:event.clientY
      }
    );


    renderer.domElement
    .setPointerCapture(
      event.pointerId
    );


    if(
      activePointers.size===1
    ){

      previousX =
      event.clientX;

      previousY =
      event.clientY;

    }


    if(
      activePointers.size===2
    ){

      const points =
      [...activePointers.values()];


      previousPinchDistance =
      Math.hypot(

        points[1].x -
        points[0].x,

        points[1].y -
        points[0].y

      );

    }

  }
);


/* =========================================================
   POINTER MOVE
========================================================= */

renderer.domElement.addEventListener(
  "pointermove",
  event=>{

    if(
      !activePointers.has(
        event.pointerId
      )
    ){
      return;
    }


    activePointers.set(
      event.pointerId,
      {
        x:event.clientX,
        y:event.clientY
      }
    );


    /*
      한 손가락 회전
    */

    if(
      activePointers.size===1
    ){

      const dx =
      event.clientX -
      previousX;


      const dy =
      event.clientY -
      previousY;


      targetRotationY +=
      dx*.009;


      targetRotationX +=
      dy*.004;


      targetRotationX =
      THREE.MathUtils.clamp(
        targetRotationX,
        -.36,
        .30
      );


      previousX =
      event.clientX;


      previousY =
      event.clientY;

    }


    /*
      두 손가락 확대 / 축소
    */

    if(
      activePointers.size===2
    ){

      const points =
      [...activePointers.values()];


      const distance =
      Math.hypot(

        points[1].x -
        points[0].x,

        points[1].y -
        points[0].y

      );


      if(
        previousPinchDistance!==null
      ){

        const difference =
        distance -
        previousPinchDistance;


        targetDistance -=
        difference*.09;


        targetDistance =
        THREE.MathUtils.clamp(
          targetDistance,
          16,
          70
        );

      }


      previousPinchDistance =
      distance;

    }

  }
);


/* =========================================================
   POINTER RELEASE
========================================================= */

function removePointer(event){

  activePointers.delete(
    event.pointerId
  );


  previousPinchDistance = null;


  if(
    activePointers.size===1
  ){

    const point =
    [...activePointers.values()][0];


    previousX =
    point.x;


    previousY =
    point.y;

  }

}


renderer.domElement.addEventListener(
  "pointerup",
  removePointer
);


renderer.domElement.addEventListener(
  "pointercancel",
  removePointer
);


/* =========================================================
   WHEEL ZOOM
========================================================= */

renderer.domElement.addEventListener(
  "wheel",
  event=>{

    autoRotate = false;


    targetDistance +=
    event.deltaY*.02;


    targetDistance =
    THREE.MathUtils.clamp(
      targetDistance,
      16,
      70
    );

  },
  {
    passive:true
  }
);


/* =========================================================
   UI
========================================================= */

const resetBtn =
document.getElementById("resetBtn");

const autoBtn =
document.getElementById("autoBtn");

const degree =
document.getElementById("degree");

const zoomText =
document.getElementById("zoomText");


resetBtn.addEventListener(
  "click",
  ()=>{

    autoRotate = false;

    targetRotationY = 0;

    targetRotationX = -.04;

    targetDistance = 42;

    autoBtn.textContent =
    "자동회전";

  }
);


autoBtn.addEventListener(
  "click",
  ()=>{

    autoRotate =
    !autoRotate;


    autoBtn.textContent =
    autoRotate
    ? "자동회전 중"
    : "자동회전";

  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
    window.innerWidth /
    window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const delta =
  clock.getDelta();


  if(autoRotate){

    targetRotationY +=
    delta*.23;

  }


  rotationY =
  THREE.MathUtils.lerp(
    rotationY,
    targetRotationY,
    .09
  );


  rotationX =
  THREE.MathUtils.lerp(
    rotationX,
    targetRotationX,
    .09
  );


  cameraDistance =
  THREE.MathUtils.lerp(
    cameraDistance,
    targetDistance,
    .11
  );


  building.rotation.y =
  rotationY;


  building.rotation.x =
  rotationX;


  camera.position.set(

    0,

    TOTAL_HEIGHT*.53,

    cameraDistance

  );


  camera.lookAt(
    0,
    TOTAL_HEIGHT*.51,
    0
  );


  let deg =
  THREE.MathUtils.radToDeg(
    rotationY
  );


  deg =
  ((deg%360)+360)%360;


  degree.textContent =
  `${Math.round(deg)}°`;


  zoomText.textContent =
  `${
    Math.round(
      42 /
      cameraDistance *
      100
    )
  }%`;


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>

</html>
