<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HAUSTORY 360° Building</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  touch-action:none;
  overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif
}
#app{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 50% 12%,rgba(255,255,255,.95),transparent 40%),
    linear-gradient(180deg,#d8eaf0 0%,#bfd5dc 63%,#9caf98 100%)
}
canvas{display:block;width:100%;height:100%;touch-action:none}

.ui{position:fixed;inset:0;z-index:20;pointer-events:none}
.topbar{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  left:16px;right:16px;
  display:flex;align-items:center;justify-content:space-between
}
.title,.bottom,button{
  border:1px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.43);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 30px rgba(30,50,55,.08)
}
.title{padding:10px 14px;border-radius:16px;color:#24343b}
.title strong{display:block;font-size:14px}
.title span{display:block;margin-top:3px;font-size:9px;letter-spacing:.15em;opacity:.55}
.controls{display:flex;gap:7px;pointer-events:auto}
button{
  height:42px;padding:0 14px;border-radius:14px;
  color:#23343b;font:inherit;font-size:12px;font-weight:700
}
.bottom{
  position:absolute;left:50%;
  bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));
  transform:translateX(-50%);
  width:min(92vw,430px);
  padding:13px 16px;border-radius:18px;text-align:center;color:#283b41
}
.bottom strong{display:block;font-size:13px}
.bottom span{display:block;margin-top:4px;font-size:10px;opacity:.58}
.status{
  display:flex;justify-content:center;gap:13px;
  margin-top:7px;font-size:10px;font-weight:700;opacity:.7
}
</style>
</head>

<body>

<div id="app"></div>

<div class="ui">
  <div class="topbar">
    <div class="title">
      <strong>HAUSTORY · 25F</strong>
      <span>3D BUILDING MASSING V2</span>
    </div>

    <div class="controls">
      <button id="autoBtn">자동회전</button>
      <button id="resetBtn">정면</button>
    </div>
  </div>

  <div class="bottom">
    <strong>손가락으로 건물을 돌려보세요</strong>
    <span>좌우 회전 · 위아래 시점 · 두 손가락 확대/축소</span>

    <div class="status">
      <div id="degree">0°</div>
      <div id="zoomText">100%</div>
    </div>
  </div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

/* ==========================
   실제 치수 데이터 영역
========================== */

const TOTAL_FLOORS = 25;
const WING_FLOORS  = 22;

const FLOOR_HEIGHT = .9;

const BUILDING_WIDTH = 10;
const BUILDING_DEPTH = 5.8;

const BODY_FLOORS = TOTAL_FLOORS - 1;
const BODY_HEIGHT = BODY_FLOORS * FLOOR_HEIGHT;

const TOP_FLOOR_HEIGHT = 1.25;
const TOTAL_HEIGHT = BODY_HEIGHT + TOP_FLOOR_HEIGHT;

const WING_HEIGHT =
  WING_FLOORS * FLOOR_HEIGHT;


/* ==========================
   SCENE
========================== */

const app =
  document.getElementById("app");

const scene =
  new THREE.Scene();

scene.fog =
  new THREE.Fog(0xd9e5e7,48,90);


/* ==========================
   CAMERA
========================== */

const camera =
  new THREE.PerspectiveCamera(
    34,
    innerWidth / innerHeight,
    .1,
    200
  );

let cameraDistance = 42;
let targetDistance = 42;

let cameraPitch = .11;
let targetPitch = .11;


/* ==========================
   RENDERER
========================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    alpha:true,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.12;

renderer.domElement.style.touchAction =
  "none";

app.appendChild(
  renderer.domElement
);


/* ==========================
   LIGHT
========================== */

scene.add(
  new THREE.HemisphereLight(
    0xebf8ff,
    0x68755f,
    2.65
  )
);

const sun =
  new THREE.DirectionalLight(
    0xfff2dd,
    3.3
  );

sun.position.set(-14,30,18);
sun.castShadow = true;

sun.shadow.mapSize.set(
  2048,
  2048
);

sun.shadow.camera.left   = -24;
sun.shadow.camera.right  = 24;
sun.shadow.camera.top    = 38;
sun.shadow.camera.bottom = -12;

scene.add(sun);

const fill =
  new THREE.DirectionalLight(
    0xb8dbe9,
    1.45
  );

fill.position.set(
  18,
  14,
  -16
);

scene.add(fill);


/* ==========================
   MATERIAL
========================== */

const MAT = {

  dark:
    new THREE.MeshStandardMaterial({
      color:0x323e44,
      roughness:.57
    }),

  side:
    new THREE.MeshStandardMaterial({
      color:0x46555b,
      roughness:.64
    }),

  white:
    new THREE.MeshStandardMaterial({
      color:0xe8ecea,
      roughness:.54
    }),

  whiteBright:
    new THREE.MeshStandardMaterial({
      color:0xf5f6f4,
      roughness:.44
    }),

  glass:
    new THREE.MeshStandardMaterial({
      color:0x637981,
      roughness:.21,
      metalness:.08
    }),

  lit:
    new THREE.MeshStandardMaterial({
      color:0xd2b274,
      emissive:0x845c2a,
      emissiveIntensity:.72,
      roughness:.35
    }),

  wing:
    new THREE.MeshStandardMaterial({
      color:0x8b8376,
      roughness:.68
    }),

  wingDark:
    new THREE.MeshStandardMaterial({
      color:0x665f56,
      roughness:.7
    }),

  wingGlass:
    new THREE.MeshStandardMaterial({
      color:0x718184,
      roughness:.27
    }),

  roof:
    new THREE.MeshStandardMaterial({
      color:0xb8c0bd,
      roughness:.84
    }),

  metal:
    new THREE.MeshStandardMaterial({
      color:0x717b80,
      roughness:.35,
      metalness:.7
    }),

  rail:
    new THREE.MeshStandardMaterial({
      color:0x1d292e,
      roughness:.52,
      metalness:.18
    })

};


/* ==========================
   BUILDING
========================== */

const building =
  new THREE.Group();

scene.add(building);


/* ==========================
   HELPERS
========================== */

function box(
  w,h,d,
  material,
  x,y,z,
  parent=building
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material
    );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  parent.add(mesh);

  return mesh;
}


function randomLight(
  floor,
  column,
  side
){

  return (
    (
      floor*7 +
      column*11 +
      side*17
    ) % 31 === 0
  );
}


/* =========================================================
   MAIN MASS
========================================================= */

const mainBody =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      BUILDING_WIDTH,
      BODY_HEIGHT,
      BUILDING_DEPTH
    ),

    [
      MAT.side,
      MAT.side,
      MAT.dark,
      MAT.dark,
      MAT.dark,
      MAT.dark
    ]

  );

mainBody.position.y =
  BODY_HEIGHT/2;

mainBody.castShadow = true;
mainBody.receiveShadow = true;

building.add(mainBody);


/* ==========================
   TOP FLOOR
========================== */

box(
  BUILDING_WIDTH,
  TOP_FLOOR_HEIGHT,
  BUILDING_DEPTH,

  MAT.dark,

  0,
  BODY_HEIGHT +
  TOP_FLOOR_HEIGHT/2,
  0
);


/* =========================================================
   MAIN FRONT / BACK WINDOWS
========================================================= */

const frontColumns = [
  -3.75,
  -2.55,
  -.75,
  .75,
  2.55,
  3.75
];


for(
  let floor=0;
  floor<BODY_FLOORS;
  floor++
){

  const y =
    floor*FLOOR_HEIGHT +
    FLOOR_HEIGHT*.52;


  frontColumns.forEach(
    (x,column)=>{

      box(
        .82,.52,.11,

        randomLight(
          floor,column,0
        )
          ? MAT.lit
          : MAT.glass,

        x,
        y,
        BUILDING_DEPTH/2+.13
      );


      box(
        .82,.52,.11,

        randomLight(
          floor,column,1
        )
          ? MAT.lit
          : MAT.glass,

        x,
        y,
        -BUILDING_DEPTH/2-.13
      );

    }
  );

}


/* =========================================================
   MAIN SIDE WINDOWS
========================================================= */

const sideColumns = [
  -1.75,
  0,
  1.75
];


for(
  let floor=0;
  floor<BODY_FLOORS;
  floor++
){

  const y =
    floor*FLOOR_HEIGHT +
    FLOOR_HEIGHT*.52;


  sideColumns.forEach(
    (z,column)=>{

      box(
        .11,.52,.88,

        randomLight(
          floor,column,2
        )
          ? MAT.lit
          : MAT.glass,

        BUILDING_WIDTH/2+.13,
        y,
        z
      );


      box(
        .11,.52,.88,

        randomLight(
          floor,column,3
        )
          ? MAT.lit
          : MAT.glass,

        -BUILDING_WIDTH/2-.13,
        y,
        z
      );

    }
  );

}


/* =========================================================
   MAIN WHITE FRAMES
========================================================= */

[
  -4.55,
  -1.65,
  1.65,
  4.55

].forEach(x=>{

  box(
    .48,
    TOTAL_HEIGHT+.15,
    .22,

    MAT.whiteBright,

    x,
    TOTAL_HEIGHT/2,
    BUILDING_DEPTH/2+.15
  );


  box(
    .48,
    TOTAL_HEIGHT+.15,
    .22,

    MAT.whiteBright,

    x,
    TOTAL_HEIGHT/2,
    -BUILDING_DEPTH/2-.15
  );

});


[
  6.3,
  12.6,
  18
].forEach(y=>{

  box(
    BUILDING_WIDTH+.08,
    .15,
    .22,

    MAT.white,

    0,
    y,
    BUILDING_DEPTH/2+.14
  );


  box(
    BUILDING_WIDTH+.08,
    .15,
    .22,

    MAT.white,

    0,
    y,
    -BUILDING_DEPTH/2-.14
  );

});


/* =========================================================
   TOP FLOOR GLASS
========================================================= */

const topY =
  BODY_HEIGHT+.63;


[
  -3.8,
  -2.25,
  -.75,
  .75,
  2.25,
  3.8

].forEach(x=>{

  box(
    1.12,.88,.13,

    MAT.glass,

    x,
    topY,
    BUILDING_DEPTH/2+.15
  );


  box(
    1.12,.88,.13,

    MAT.glass,

    x,
    topY,
    -BUILDING_DEPTH/2-.15
  );

});


/* =========================================================
   RIGHT PROTRUDING WING
   실제처럼 본체보다 우측으로 튀어나온 별도 매스
========================================================= */

const WING_WIDTH = 2.8;
const WING_DEPTH = 3.8;

const WING_X =
  BUILDING_WIDTH/2 +
  WING_WIDTH/2 -
  .35;

const WING_Z = -.55;


/*
  본체 측면과 살짝 겹치게 해서
  하나의 건물처럼 연결
*/

const wingBody =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      WING_WIDTH,
      WING_HEIGHT,
      WING_DEPTH
    ),

    [
      MAT.wingDark,
      MAT.wingDark,
      MAT.wing,
      MAT.wing,
      MAT.wing,
      MAT.wing
    ]

  );

wingBody.position.set(
  WING_X,
  WING_HEIGHT/2,
  WING_Z
);

wingBody.castShadow = true;
wingBody.receiveShadow = true;

building.add(wingBody);


/* ==========================
   WING OUTER WINDOWS
========================== */

const wingSideZ = [
  -1.35,
  -.45,
  .45
];


for(
  let floor=0;
  floor<WING_FLOORS;
  floor++
){

  const y =
    floor*FLOOR_HEIGHT +
    FLOOR_HEIGHT*.52;


  wingSideZ.forEach(
    (localZ,column)=>{

      box(
        .11,.52,.62,

        randomLight(
          floor,column,10
        )
          ? MAT.lit
          : MAT.wingGlass,

        WING_X +
        WING_WIDTH/2 +
        .07,

        y,

        WING_Z +
        localZ
      );

    }
  );

}


/* ==========================
   WING FRONT WINDOWS
========================== */

const wingFrontX = [
  -.72,
  .15,
  .88
];


for(
  let floor=0;
  floor<WING_FLOORS;
  floor++
){

  const y =
    floor*FLOOR_HEIGHT +
    FLOOR_HEIGHT*.52;


  wingFrontX.forEach(
    (localX,column)=>{

      box(
        .58,.52,.1,

        randomLight(
          floor,column,11
        )
          ? MAT.lit
          : MAT.wingGlass,

        WING_X +
        localX,

        y,

        WING_Z +
        WING_DEPTH/2 +
        .07
      );

    }
  );

}


/* ==========================
   WING TRIM
========================== */

box(
  WING_WIDTH+.3,
  .18,
  WING_DEPTH+.3,

  MAT.white,

  WING_X,
  WING_HEIGHT+.09,
  WING_Z
);


box(
  .18,
  WING_HEIGHT,
  WING_DEPTH+.08,

  MAT.white,

  WING_X +
  WING_WIDTH/2 +
  .09,

  WING_HEIGHT/2,
  WING_Z
);


/* =========================================================
   MAIN ROOF CAP
   ★ 본체보다 바깥으로 돌출
========================================================= */

const CAP_WIDTH =
  BUILDING_WIDTH + 1.15;

const CAP_DEPTH =
  BUILDING_DEPTH + 1.05;


/*
  실제 이미지처럼 건물 위를
  덮는 두꺼운 슬래브
*/

box(
  CAP_WIDTH,
  .28,
  CAP_DEPTH,

  MAT.whiteBright,

  0,
  TOTAL_HEIGHT+.14,
  0
);


/*
  캡 아래쪽 그림자 홈
*/

box(
  BUILDING_WIDTH+.25,
  .10,
  BUILDING_DEPTH+.2,

  MAT.side,

  0,
  TOTAL_HEIGHT-.04,
  0
);


/* =========================================================
   SIGNATURE FRONT FASCIA
   루프캡 전면만 높게 솟은 사선 패널
========================================================= */

function createSignatureFascia(){

  const width =
    CAP_WIDTH;

  const thickness =
    .27;

  const leftHeight =
    1.03;

  const rightHeight =
    1.82;


  const shape =
    new THREE.Shape();


  shape.moveTo(
    -width/2,
    0
  );

  shape.lineTo(
    width/2,
    0
  );

  shape.lineTo(
    width/2,
    rightHeight
  );

  shape.lineTo(
    -width/2,
    leftHeight
  );

  shape.closePath();


  const geometry =
    new THREE.ExtrudeGeometry(
      shape,
      {
        depth:thickness,
        bevelEnabled:false
      }
    );


  geometry.translate(
    0,
    0,
    -thickness/2
  );


  const fascia =
    new THREE.Mesh(
      geometry,
      MAT.whiteBright
    );


  fascia.position.set(

    0,

    TOTAL_HEIGHT+.12,

    CAP_DEPTH/2 +
    thickness/2 -
    .03

  );


  fascia.castShadow = true;
  fascia.receiveShadow = true;


  building.add(fascia);

}

createSignatureFascia();


/* =========================================================
   LOW SIDE / REAR PARAPET

   기존처럼 높게 막지 않고 낮은 턱만 표현
========================================================= */

box(
  CAP_WIDTH,
  .46,
  .20,

  MAT.white,

  0,
  TOTAL_HEIGHT+.37,
  -CAP_DEPTH/2+.1
);


box(
  .20,
  .46,
  CAP_DEPTH,

  MAT.white,

  -CAP_WIDTH/2+.1,
  TOTAL_HEIGHT+.37,
  0
);


box(
  .20,
  .46,
  CAP_DEPTH,

  MAT.white,

  CAP_WIDTH/2-.1,
  TOTAL_HEIGHT+.37,
  0
);


/* =========================================================
   HAUSTORY LOGO
========================================================= */

function createLogoTexture(){

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width = 1024;
  canvas.height = 256;


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );


  ctx.font =
    "900 124px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillStyle =
    "rgba(0,0,0,.18)";

  ctx.fillText(
    "HAUSTORY",
    516,
    143
  );


  ctx.fillStyle =
    "#273238";

  ctx.fillText(
    "HAUSTORY",
    512,
    132
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );

  texture.colorSpace =
    THREE.SRGBColorSpace;

  return texture;

}


const logoMaterial =
  new THREE.MeshBasicMaterial({
    map:createLogoTexture(),
    transparent:true
  });


const logo =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      6.45,
      1.55
    ),

    logoMaterial

  );


logo.position.set(

  1.0,

  TOTAL_HEIGHT+1.02,

  CAP_DEPTH/2+.31

);


building.add(logo);


/* =========================================================
   ROOFTOP MACHINE ROOM
========================================================= */

box(
  2.25,
  .78,
  1.65,

  MAT.roof,

  3.0,
  TOTAL_HEIGHT+.66,
  -1.1
);


/* =========================================================
   SOLAR TEXTURE
========================================================= */

function makeSolarTexture(){

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width = 512;
  canvas.height = 768;


  const ctx =
    canvas.getContext("2d");


  const base =
    ctx.createLinearGradient(
      0,0,
      512,768
    );


  base.addColorStop(
    0,
    "#315d78"
  );

  base.addColorStop(
    .5,
    "#173c55"
  );

  base.addColorStop(
    1,
    "#0d2a40"
  );


  ctx.fillStyle = base;

  ctx.fillRect(
    0,0,
    512,768
  );


  const cols = 6;
  const rows = 10;

  const cw =
    512/cols;

  const ch =
    768/rows;


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const x = c*cw;
      const y = r*ch;


      ctx.strokeStyle =
        "rgba(170,215,230,.27)";

      ctx.lineWidth = 2;

      ctx.strokeRect(
        x+3,
        y+3,
        cw-6,
        ch-6
      );


      ctx.strokeStyle =
        "rgba(220,235,240,.17)";

      ctx.lineWidth = 1;


      ctx.beginPath();

      ctx.moveTo(
        x+cw*.36,
        y+5
      );

      ctx.lineTo(
        x+cw*.36,
        y+ch-5
      );


      ctx.moveTo(
        x+cw*.64,
        y+5
      );

      ctx.lineTo(
        x+cw*.64,
        y+ch-5
      );

      ctx.stroke();

    }

  }


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.colorSpace =
    THREE.SRGBColorSpace;


  texture.anisotropy =
    renderer.capabilities
    .getMaxAnisotropy();


  return texture;

}


const solarSurfaceMat =
  new THREE.MeshStandardMaterial({

    map:makeSolarTexture(),

    roughness:.18,

    metalness:.10

  });


/* =========================================================
   SOLAR MODULE
========================================================= */

function solarModule(
  width=.94,
  depth=1.5
){

  const group =
    new THREE.Group();


  /*
    금속 후판
  */

  const back =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        width,
        .055,
        depth
      ),

      MAT.metal

    );


  back.castShadow = true;

  group.add(back);


  /*
    태양전지 유리
  */

  const surface =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        width-.07,
        depth-.07
      ),

      solarSurfaceMat

    );


  surface.rotation.x =
    -Math.PI/2;


  surface.position.y =
    .031;


  group.add(surface);


  /*
    알루미늄 프레임
  */

  const frameH = .07;
  const frameT = .045;


  const north =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        width,
        frameH,
        frameT
      ),

      MAT.metal

    );


  north.position.set(
    0,
    .035,
    -depth/2
  );


  group.add(north);


  const south =
    north.clone();

  south.position.z =
    depth/2;

  group.add(south);


  const west =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        frameT,
        frameH,
        depth
      ),

      MAT.metal

    );


  west.position.set(
    -width/2,
    .035,
    0
  );

  group.add(west);


  const east =
    west.clone();

  east.position.x =
    width/2;

  group.add(east);


  return group;

}


/* =========================================================
   SOLAR ARRAY
========================================================= */

function solarArray({

  x=0,
  y=TOTAL_HEIGHT+.39,
  z=0,

  columns=4,
  rows=2,

  width=.94,
  depth=1.5,

  gap=.09,
  tilt=3

}){

  const group =
    new THREE.Group();


  const totalW =
    columns*width +
    (columns-1)*gap;


  const totalD =
    rows*depth +
    (rows-1)*gap;


  /*
    하부 레일
  */

  for(
    let r=0;
    r<=rows;
    r++
  ){

    const rail =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          totalW+.18,
          .05,
          .05
        ),

        MAT.metal

      );


    rail.position.set(

      0,

      -.09,

      -totalD/2 +
      r*(totalD/rows)

    );


    group.add(rail);

  }


  /*
    모듈
  */

  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<columns;
      c++
    ){

      const panel =
        solarModule(
          width,
          depth
        );


      panel.position.x =

        -totalW/2 +
        width/2 +
        c*(width+gap);


      panel.position.z =

        -totalD/2 +
        depth/2 +
        r*(depth+gap);


      group.add(panel);

    }

  }


  group.rotation.x =
    THREE.MathUtils
    .degToRad(-tilt);


  group.position.set(
    x,y,z
  );


  building.add(group);

}


/* =========================================================
   MAIN ROOF PANELS

   실제 참고 이미지처럼
   넓고 길게 배열
========================================================= */

solarArray({

  x:-1.3,

  z:-.28,

  columns:4,

  rows:2,

  width:.93,

  depth:1.5,

  gap:.085,

  tilt:3

});


/* =========================================================
   WING ROOF PANEL
========================================================= */

solarArray({

  x:WING_X,

  y:WING_HEIGHT+.33,

  z:WING_Z,

  columns:2,

  rows:1,

  width:.82,

  depth:1.35,

  gap:.08,

  tilt:3

});


/* =========================================================
   GROUND
========================================================= */

const ground =
  new THREE.Mesh(

    new THREE.CircleGeometry(
      34,
      96
    ),

    new THREE.MeshStandardMaterial({
      color:0x91a58c,
      roughness:1
    })

  );


ground.rotation.x =
  -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   INTERACTION
========================================================= */

let rotationY = 0;
let targetRotationY = 0;

let autoRotate = true;

const activePointers =
  new Map();

let previousX = 0;
let previousY = 0;

let previousPinchDistance =
  null;


/* ==========================
   POINTER DOWN
========================== */

renderer.domElement.addEventListener(
  "pointerdown",
  event=>{

    autoRotate = false;


    activePointers.set(
      event.pointerId,
      {
        x:event.clientX,
        y:event.clientY
      }
    );


    renderer.domElement
    .setPointerCapture(
      event.pointerId
    );


    if(
      activePointers.size===1
    ){

      previousX =
        event.clientX;

      previousY =
        event.clientY;

    }


    if(
      activePointers.size===2
    ){

      const p =
        [...activePointers.values()];


      previousPinchDistance =
        Math.hypot(
          p[1].x-p[0].x,
          p[1].y-p[0].y
        );

    }

  }
);


/* ==========================
   POINTER MOVE
========================== */

renderer.domElement.addEventListener(
  "pointermove",
  event=>{

    if(
      !activePointers.has(
        event.pointerId
      )
    ){
      return;
    }


    activePointers.set(
      event.pointerId,
      {
        x:event.clientX,
        y:event.clientY
      }
    );


    /*
      한 손가락
      좌우 = 건물 회전
      위아래 = 카메라 높이
    */

    if(
      activePointers.size===1
    ){

      const dx =
        event.clientX -
        previousX;


      const dy =
        event.clientY -
        previousY;


      targetRotationY +=
        dx*.009;


      targetPitch +=
        dy*.0035;


      targetPitch =
        THREE.MathUtils.clamp(
          targetPitch,
          -.11,
          .60
        );


      previousX =
        event.clientX;


      previousY =
        event.clientY;

    }


    /*
      두 손가락 핀치
    */

    if(
      activePointers.size===2
    ){

      const p =
        [...activePointers.values()];


      const distance =
        Math.hypot(
          p[1].x-p[0].x,
          p[1].y-p[0].y
        );


      if(
        previousPinchDistance!==null
      ){

        const difference =
          distance -
          previousPinchDistance;


        targetDistance -=
          difference*.09;


        targetDistance =
          THREE.MathUtils.clamp(
            targetDistance,
            17,
            72
          );

      }


      previousPinchDistance =
        distance;

    }

  }
);


/* ==========================
   POINTER RELEASE
========================== */

function removePointer(event){

  activePointers.delete(
    event.pointerId
  );


  previousPinchDistance =
    null;


  if(
    activePointers.size===1
  ){

    const p =
      [...activePointers.values()][0];


    previousX = p.x;
    previousY = p.y;

  }

}


renderer.domElement.addEventListener(
  "pointerup",
  removePointer
);


renderer.domElement.addEventListener(
  "pointercancel",
  removePointer
);


/* ==========================
   WHEEL
========================== */

renderer.domElement.addEventListener(
  "wheel",
  event=>{

    autoRotate = false;


    targetDistance +=
      event.deltaY*.02;


    targetDistance =
      THREE.MathUtils.clamp(
        targetDistance,
        17,
        72
      );

  },
  {
    passive:true
  }
);


/* =========================================================
   UI
========================================================= */

const resetBtn =
  document.getElementById(
    "resetBtn"
  );

const autoBtn =
  document.getElementById(
    "autoBtn"
  );

const degree =
  document.getElementById(
    "degree"
  );

const zoomText =
  document.getElementById(
    "zoomText"
  );


resetBtn.addEventListener(
  "click",
  ()=>{

    autoRotate = false;

    targetRotationY = 0;

    targetPitch = .11;

    targetDistance = 42;

    autoBtn.textContent =
      "자동회전";

  }
);


autoBtn.addEventListener(
  "click",
  ()=>{

    autoRotate =
      !autoRotate;


    autoBtn.textContent =
      autoRotate
      ? "자동회전 중"
      : "자동회전";

  }
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth /
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const delta =
    clock.getDelta();


  if(autoRotate){

    targetRotationY +=
      delta*.22;

  }


  rotationY =
    THREE.MathUtils.lerp(
      rotationY,
      targetRotationY,
      .09
    );


  cameraPitch =
    THREE.MathUtils.lerp(
      cameraPitch,
      targetPitch,
      .09
    );


  cameraDistance =
    THREE.MathUtils.lerp(
      cameraDistance,
      targetDistance,
      .11
    );


  building.rotation.y =
    rotationY;


  /*
    건물을 기울이지 않고
    카메라 자체가 위/아래로 이동한다.
  */

  const lookY =
    TOTAL_HEIGHT*.48;


  const horizontalDistance =
    cameraDistance *
    Math.cos(cameraPitch);


  camera.position.set(

    0,

    lookY +
    cameraDistance *
    Math.sin(cameraPitch),

    horizontalDistance

  );


  camera.lookAt(
    0,
    lookY,
    0
  );


  let deg =
    THREE.MathUtils
    .radToDeg(
      rotationY
    );


  deg =
    ((deg%360)+360)%360;


  degree.textContent =
    `${Math.round(deg)}°`;


  zoomText.textContent =
    `${
      Math.round(
        42 /
        cameraDistance *
        100
      )
    }%`;


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>
